<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mis Escuelas ⚽ v3</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --green:#15803d;
  --red:#dc2626;
  --blue:#2563eb;
  --line:#e5e7eb;
  --amber:#b45309;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:88px;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 18px 18px;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:5px 0 0;
  color:#cbd5e1;
  font-size:14px;
}

main{
  max-width:760px;
  margin:auto;
  padding:15px;
}

.selector,
.card{
  background:var(--card);
  border-radius:16px;
  box-shadow:0 2px 10px #0000000b;
}

.selector{
  padding:12px;
  margin-bottom:14px;
}

select,
input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  font:inherit;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  padding:15px;
}

.metric{
  font-size:23px;
  font-weight:800;
  margin-top:4px;
}

.label{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:14px 0;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px;
  font:inherit;
  font-weight:750;
  background:#111827;
  color:#fff;
  cursor:pointer;
}

.btn:active{
  transform:scale(.98);
}

.green{
  background:var(--green);
}

.blue{
  background:var(--blue);
}

.danger{
  background:#b91c1c;
}

.amber{
  background:var(--amber);
}

.ghost{
  background:#fff;
  color:#111827;
  border:1px solid var(--line);
}

.section{
  margin-top:14px;
}

.section h2{
  font-size:18px;
  margin:0 0 10px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.row .info{
  min-width:0;
}

.row b{
  display:block;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fee2e2;
  color:#991b1b;
}

.bluebadge{
  background:#dbeafe;
  color:#1e40af;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.search{
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:24px 8px;
}

.notice{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
}

.success{
  background:#dcfce7;
  border:1px solid #86efac;
  color:#166534;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
}

.error{
  background:#fee2e2;
  border:1px solid #fca5a5;
  color:#991b1b;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
}

.modal{
  display:none;
  position:fixed;
  z-index:20;
  inset:0;
  background:#0008;
  align-items:flex-end;
  padding:0;
}

.modal.show{
  display:flex;
}

.sheet{
  background:#fff;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin-top:0;
}

.field{
  margin:10px 0;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:10;
}

nav button{
  border:0;
  background:none;
  color:#6b7280;
  font:inherit;
  font-size:11px;
  cursor:pointer;
}

nav button.active{
  color:#111827;
  font-weight:800;
}

nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.table th,
.table td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.right{
  text-align:right!important;
}

.reportbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.mini{
  background:#f9fafb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.mini b{
  display:block;
  font-size:16px;
  margin-top:2px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:14px 0;
}

.status{
  font-size:12px;
  margin-top:10px;
}

@media(min-width:600px){

  .modal{
    align-items:center;
    padding:20px;
  }

  .sheet{
    border-radius:20px;
  }

  .actions{
    grid-template-columns:1fr 1fr 1fr;
  }

  .reportbar{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Mis Escuelas</h1>
  <p>Gestión de jugadores, cuotas, historial y comprobantes · v3</p>
</header>

<main>

  <div class="selector">

    <div class="small">
      ESCUELA / SEDE
    </div>

    <select id="school"></select>

    <div id="connectionStatus" class="status"></div>

  </div>

  <div id="app"></div>

</main>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="sheet">

    <h2 id="modalTitle"></h2>

    <div id="form"></div>

    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="saveForm()">
        Guardar
      </button>

      <button
        type="button"
        class="btn"
        onclick="closeModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>

<!-- NAVEGACIÓN -->

<nav>

  <button
    type="button"
    class="active"
    onclick="setView('home',this)">
    <span>🏠</span>
    Inicio
  </button>

  <button
    type="button"
    onclick="setView('players',this)">
    <span>👥</span>
    Jugadores
  </button>

  <button
    type="button"
    onclick="setView('payments',this)">
    <span>💰</span>
    Cuotas
  </button>

  <button
    type="button"
    onclick="setView('reports',this)">
    <span>📊</span>
    Reportes
  </button>

  <button
    type="button"
    onclick="setView('settings',this)">
    <span>⚙️</span>
    Opciones
  </button>

</nav>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://inehoqxikbsuhguxxngz.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_sy4qDmB2FcYZ6hC_2IWJLA_H9u89I2h';

/*
  ESTA ES LA PARTE QUE ANTES TE FALTABA.

  createClient pertenece a supabase-js.
*/

let supabaseClient = null;

try {

  if (
    window.supabase &&
    typeof window.supabase.createClient === 'function'
  ) {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  }

} catch(error) {

  console.error(
    'Error inicializando Supabase:',
    error
  );

}


/* =====================================================
   DATOS LOCALES
===================================================== */

const KEY = 'misEscuelas_v3';

const OLD_KEY = 'misEscuelas_v2';

const DEFAULT_SCHOOLS = [
  'Semillitas',
  'La Cantera',
  'Nueva Escuela'
];

let data =
  JSON.parse(
    localStorage.getItem(KEY) || 'null'
  );

if(!data){

  const old =
    JSON.parse(
      localStorage.getItem(OLD_KEY) || 'null'
    );

  data =
    old || {
      schools:DEFAULT_SCHOOLS,
      players:[],
      payments:[],
      expenses:[],
      fees:{},
      feeHistory:{}
    };

}else{

  data.schools =
    data.schools || [];

  data.players =
    data.players || [];

  data.payments =
    data.payments || [];

  data.expenses =
    data.expenses || [];

  data.fees =
    data.fees || {};

  data.feeHistory =
    data.feeHistory || {};

}

data.schools =
  [
    ...new Set(
      [
        ...DEFAULT_SCHOOLS,
        ...(data.schools || [])
      ]
    )
  ];

data.players =
  data.players || [];

data.payments =
  data.payments || [];

data.expenses =
  data.expenses || [];

data.fees =
  data.fees || {};

data.feeHistory =
  data.feeHistory || {};

localStorage.setItem(
  KEY,
  JSON.stringify(data)
);


/* =====================================================
   VARIABLES
===================================================== */

let currentView = 'home';

let editId = null;

let formType = null;

let reportMonth = monthKey();

let showInactive = false;

const school =
  document.getElementById('school');


/* =====================================================
   FUNCIONES GENERALES
===================================================== */

const money = n =>

  new Intl.NumberFormat(
    'es-AR',
    {
      style:'currency',
      currency:'ARS',
      maximumFractionDigits:0
    }
  ).format(
    Number(n) || 0
  );


const esc = s =>

  String(s ?? '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );


const attr = s =>
  esc(s);


function id(){

  return (
    'id_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function persist(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


function monthKey(
  d = new Date()
){

  return (

    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0')

  );

}


function monthName(
  key = monthKey()
){

  const parts =
    key.split('-')
      .map(Number);

  const y = parts[0];

  const m = parts[1];

  return new Date(
    y,
    m-1,
    1
  ).toLocaleDateString(
    'es-AR',
    {
      month:'long',
      year:'numeric'
    }
  );

}


/* =====================================================
   ESCUELA
===================================================== */

function currentSchool(){

  return (
    data.schools[
      Number(school.value) || 0
    ]
  );

}


function init(){

  school.innerHTML =
    data.schools
      .map(
        (s,i) =>
          `<option value="${i}">
            ${esc(s)}
          </option>`
      )
      .join('');

  school.onchange =
    render;

  updateConnectionStatus();

  render();

}


function updateConnectionStatus(){

  const el =
    document.getElementById(
      'connectionStatus'
    );

  if(!el)return;

  if(supabaseClient){

    el.innerHTML =
      '🟢 Supabase conectado';

    el.style.color =
      '#166534';

  }else{

    el.innerHTML =
      '🟡 Modo local';

    el.style.color =
      '#92400e';

  }

}


/* =====================================================
   JUGADORES
===================================================== */

function ps(){

  return data.players.filter(

    p =>
      p.school === currentSchool() &&
      p.active !== false

  );

}


function allSchoolPlayers(){

  return data.players.filter(

    p =>
      p.school === currentSchool()

  );

}


/* =====================================================
   CUOTAS
===================================================== */

function fee(
  s = currentSchool(),
  key = monthKey()
){

  const h =
    data.feeHistory[s] || {};

  return Number(
    h[key] ??
    data.fees[s] ??
    20000
  );

}


function setFeeForMonth(
  s,
  key,
  value
){

  data.feeHistory[s] =
    data.feeHistory[s] || {};

  data.feeHistory[s][key] =
    Number(value);

  data.fees[s] =
    Number(value);

}


function paymentFor(
  playerId,
  key = monthKey()
){

  return data.payments.find(

    p =>
      p.playerId === playerId &&
      p.school === currentSchool() &&
      p.monthKey === key

  );

}


function paymentsForMonth(
  key = reportMonth
){

  return data.payments.filter(

    p =>
      p.school === currentSchool() &&
      p.monthKey === key

  );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  if(currentView === 'home'){
    home();
  }

  if(currentView === 'players'){
    players();
  }

  if(currentView === 'payments'){
    payments();
  }

  if(currentView === 'reports'){
    reports();
  }

  if(currentView === 'settings'){
    settings();
  }

}


/* =====================================================
   INICIO
===================================================== */

function home(){

  const list =
    ps();

  const key =
    monthKey();

  const paid =
    list.filter(
      p =>
        paymentFor(
          p.id,
          key
        )
    ).length;

  const collected =
    paymentsForMonth(key)
      .reduce(
        (a,p) =>
          a +
          Number(
            p.amount || 0
          ),
        0
      );

  const expected =
    list.length *
    fee(
      currentSchool(),
      key
    );

  const pending =
    Math.max(
      0,
      expected - collected
    );

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="grid">

      <div class="card">

        <div class="label">
          Jugadores activos
        </div>

        <div class="metric">
          ${list.length}
        </div>

      </div>

      <div class="card">

        <div class="label">
          Pagaron ${esc(monthName(key))}
        </div>

        <div class="metric">
          ${paid}
        </div>

      </div>

      <div class="card">

        <div class="label">
          Recaudado
        </div>

        <div class="metric">
          ${money(collected)}
        </div>

      </div>

      <div class="card">

        <div class="label">
          Pendiente estimado
        </div>

        <div class="metric">
          ${money(pending)}
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="openPlayer()">
        ＋ Agregar jugador
      </button>

      <button
        type="button"
        class="btn blue"
        onclick="openPayment()">
        ✓ Registrar pago
      </button>

      <button
        type="button"
        class="btn amber"
        onclick="setViewByName('reports')">
        📊 Ver reporte
      </button>

    </div>


    <div class="card section">

      <h2>
        📅 Cuota de ${esc(monthName(key))}
      </h2>

      ${pendingRows(list,key)}

    </div>


    <div class="notice">

      💡 Cuota del mes:
      <b>${money(fee(currentSchool(),key))}</b>.

      Podés cambiarla desde
      ⚙️ Opciones.

      Los datos se conservan en este dispositivo.

    </div>

  `;

}


function pendingRows(
  list,
  key
){

  const pend =
    list.filter(
      p =>
        !paymentFor(
          p.id,
          key
        )
    );

  if(!pend.length){

    return `
      <div class="empty">
        🎉 Todos los jugadores están al día.
      </div>
    `;

  }

  return pend.map(

    p => `

      <div class="row">

        <div class="info">

          <b>
            ${esc(p.name)}
          </b>

          <span class="small">
            ${esc(
              p.category ||
              'Sin categoría'
            )}
          </span>

        </div>

        <button
          type="button"
          class="btn green"
          style="padding:8px 10px"
          onclick="quickPay('${p.id}')">

          Pagó

        </button>

      </div>

    `

  ).join('');

}


/* =====================================================
   JUGADORES
===================================================== */

function players(){

  const list =
    allSchoolPlayers();

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="openPlayer()">

        ＋ Nuevo jugador

      </button>

      <button
        type="button"
        class="btn ghost"
        onclick="toggleInactive()">

        👤 Activos / inactivos

      </button>

    </div>


    <input
      class="search"
      id="search"
      placeholder="🔎 Buscar jugador..."
      oninput="filterPlayers()">


    <div
      class="card"
      id="playerList">

      ${playerRows(list)}

    </div>

  `;

}


function toggleInactive(){

  showInactive =
    !showInactive;

  render();

}


function playerRows(list){

  if(!list.length){

    return `
      <div class="empty">
        No hay jugadores en esta escuela.
      </div>
    `;

  }

  let view =
    showInactive
      ? list
      : list.filter(
          p =>
            p.active !== false
        );

  if(!view.length){

    return `
      <div class="empty">
        No hay jugadores activos.
      </div>
    `;

  }

  return view.map(

    p => `

      <div class="row">

        <div class="info">

          <b>

            ${esc(p.name)}

            ${
              p.active === false
                ? `<span class="badge warn">
                     INACTIVO
                   </span>`
                : ''
            }

          </b>

          <span class="small">

            ${esc(
              p.category ||
              'Sin categoría'
            )}

            ·

            ${esc(
              p.phone ||
              'Sin teléfono'
            )}

          </span>

        </div>

        <button
          type="button"
          class="btn"
          style="padding:8px 10px"
          onclick="openPlayer('${p.id}')">

          Editar

        </button>

      </div>

    `

  ).join('');

}


function filterPlayers(){

  const input =
    document.getElementById(
      'search'
    );

  if(!input)return;

  const q =
    (
      input.value || ''
    ).toLowerCase();

  const filtered =
    allSchoolPlayers()
      .filter(

        p =>

          (
            p.name +
            ' ' +
            p.category +
            ' ' +
            p.phone
          )
          .toLowerCase()
          .includes(q)

      );

  document.getElementById(
    'playerList'
  ).innerHTML =
    playerRows(filtered);

}


/* =====================================================
   PAGOS
===================================================== */

function payments(){

  const key =
    monthKey();

  const list =
    ps();

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="card">

      <div class="two">

        <div class="field">

          <label>
            Mes a consultar
          </label>

          <input
            type="month"
            id="payMonth"
            value="${key}"
            onchange="renderPaymentsMonth()">

        </div>

        <div class="field">

          <label>
            Cuota aplicada
          </label>

          <input
            value="${money(
              fee(
                currentSchool(),
                key
              )
            )}"
            disabled>

        </div>

      </div>

    </div>

    <div id="paymentsBody"></div>

  `;

  renderPaymentsMonth();

}


function renderPaymentsMonth(){

  const input =
    document.getElementById(
      'payMonth'
    );

  if(!input)return;

  const key =
    input.value ||
    monthKey();

  const list =
    ps();

  const rows =
    list.map(

      p => {

        const x =
          paymentFor(
            p.id,
            key
          );

        return `

          <div class="row">

            <div class="info">

              <b>
                ${esc(p.name)}
              </b>

              <span class="small">

                ${
                  x
                    ? money(x.amount) +
                      ' · ' +
                      esc(x.method) +
                      ' · ' +
                      formatDate(x.date)

                    : 'Sin pago registrado'
                }

              </span>

            </div>


            ${
              x

                ? `

                  <div>

                    <span class="badge paid">
                      PAGADA
                    </span>

                    <button
                      type="button"
                      class="btn ghost"
                      style="padding:7px 9px;margin-left:5px"
                      onclick="receipt('${x.id}')">

                      🧾

                    </button>

                  </div>

                `

                : `

                  <button
                    type="button"
                    class="btn green"
                    style="padding:8px 10px"
                    onclick="quickPay('${p.id}','${key}')">

                    Pagó

                  </button>

                `
            }

          </div>

        `;

      }

    ).join('');


  document.getElementById(
    'paymentsBody'
  ).innerHTML = `

    <div class="actions">

      <button
        type="button"
        class="btn blue"

function reports(){

  const key =
    reportMonth ||
    monthKey();

  const list =
    ps();

  const pay =
    paymentsForMonth(key);

  const paidIds =
    new Set(
      pay.map(
        p =>
          p.playerId
      )
    );

  const col =
    pay.reduce(
      (a,p) =>
        a +
        Number(
          p.amount || 0
        ),
      0
    );

  const expected =
    list.length *
    fee(
      currentSchool(),
      key
    );

  const pending =
    Math.max(
      0,
      expected - col
    );

  const rate =
    list.length
      ? Math.round(
          paidIds.size /
          list.length *
          100

  const methods = {};

  pay.forEach(

===================================================== */

function saveForm(){

  if(
    formType ===
    'player'
  ){

    const name =
      document.getElementById(
        'f_name'
      ).value.trim();


    if(!name){

      alert(
        'Ingresá el nombre.'
      );

      return;

    }


    const obj = {

      id:
        editId ||
        id(),

      name:name,

      category:
        document.getElementById(
          'f_cat'
        ).value.trim(),

      birth:
        document.getElementById(
          'f_birth'
        ).value,

      tutor:
        document.getElementById(
          'f_tutor'
        ).value.trim(),

      phone:
        document.getElementById(
          'f_phone'
        ).value.trim(),

      school:
        currentSchool(),

      active:
        document.getElementById(
          'f_active'
        ).value === 'true'

    };


    if(editId){

      const i =
        data.players.findIndex(
          x =>
            x.id ===
            editId
        );

      if(i >= 0){

        data.players[i] =
          obj;

      }

    }else{

      data.players.push(
        obj
      );

    }


  }else{


    const pid =
      document.getElementById(
        'f_player'
      ).value;


    const key =
      document.getElementById(
        'f_month'
      ).value;


    const amount =
      Number(
        document.getElementById(
          'f_amount'
        ).value
      ) || 0;


    if(
      !pid ||
      !key ||
      !amount
    ){

      alert(
        'Completá jugador, mes e importe.'
      );

      return;

    }


    if(
      paymentFor(
        pid,
        key
      )
    ){

      alert(
        'Ese jugador ya tiene un pago registrado para ese mes.'
      );

      return;

    }


    data.payments.push({

      id:id(),

      playerId:pid,

      school:
        currentSchool(),

      month:
        monthName(key),

      monthKey:key,

      amount:amount,

      method:
        document.getElementById(
          'f_method'
        ).value,

      note:
        document.getElementById(
          'f_note'
        ).value.trim(),

      date:
        new Date().toISOString()

    });

  }


  persist();

  closeModal();

  render();

}

function addSchool(){

  const n =
    prompt(
      'Nombre de la nueva escuela / sede:'
    );


  if(
    n &&
    n.trim()
  ){

    data.schools.push(
      n.trim()
    );

    persist();

    init();

    school.value =
      data.schools.length - 1;

    render();

  }

}


function renameSchool(i){

  const old =
    data.schools[i];

  const n =
    prompt(
      'Nuevo nombre:',
      old
    );


  if(
    n &&
    n.trim()
  ){

    const newName =
      n.trim();


    data.schools[i] =
      newName;


    data.players.forEach(

      p => {

        if(
          p.school ===
          old
        ){

          p.school =
            newName;

        }

      }

    );


    data.payments.forEach(

      p => {

        if(
          p.school ===
          old
        ){

          p.school =
            newName;

        }

      }

    );


    if(
      data.fees[old] != null
    ){

      data.fees[newName] =
        data.fees[old];

      delete data.fees[old];

    }


    if(
      data.feeHistory[old]
    ){

      data.feeHistory[newName] =
        data.feeHistory[old];

      delete data.feeHistory[old];

    }


    persist();

    init();

  }

}

/* =====================================================
   CSV
===================================================== */

function exportCSV(key){

  const rows =
    data.payments.filter(

      p =>
        p.school ===
        currentSchool() &&

        (
          !key ||
          p.monthKey === key
        )

    );


  const head = [

    'Fecha',
    'Mes',
    'Escuela',
    'Jugador',
    'Categoría',
    'Importe',
    'Medio de pago',
    'Observación'

  ];


  const out = [

    head,

    ...rows.map(

      x => {

        const p =
          data.players.find(
            q =>
              q.id ===
              x.playerId
          ) || {};


        return [

          formatDate(
            x.date
          ),

          x.month,

          x.school,

          p.name || '',

          p.category || '',

          x.amount,

          x.method || '',

          x.note || ''

        ];

      }

    )

  ];


  const csv =
    '\ufeff' +

    out
      .map(

        r =>

          r.map(

            v =>
              '"' +
              String(
                v ?? ''
              )
              .replace(
                /"/g,
                '""'
              ) +
              '"'

          ).join(';')

      )
      .join('\n');


  const blob =
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8'
      }
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    URL.createObjectURL(
      blob
    );


  a.download =
    key
      ? `mis-escuelas-pagos-${key}.csv`
      : 'mis-escuelas-todos-los-pagos.csv';


  a.click();


  setTimeout(

    () =>
      URL.revokeObjectURL(
        a.href
      ),

    500

  );

}

  );

  w.document.close();

}


/* =====================================================
   IMPRIMIR REPORTE
===================================================== */

function printReport(key){

  const pay =
    paymentsForMonth(
      key
    );


  const col =
    pay.reduce(
      (a,p) =>
        a +
        Number(
          p.amount || 0
        ),
      0
    );


  const list =
    ps();


  const expected =
    list.length *
    fee(
      currentSchool(),
      key
    );


  const paid =
    new Set(
      pay.map(
        p =>
          p.playerId
      )
    ).size;


  const rows =
    pay.map(

      x => {

        const p =
          data.players.find(
            q =>
              q.id ===
              x.playerId
          ) || {};


        return `

          <tr>

            <td>
              ${esc(
                p.name || ''
              )}
            </td>

            <td>
              ${esc(
                p.category || ''
              )}
            </td>

            <td>
              ${esc(
                x.method || ''
              )}
            </td>

            <td>
              ${formatDate(
                x.date
              )}
            </td>

            <td>
              ${money(
                x.amount
              )}
            </td>

          </tr>

        `;

      }

    ).join('');


  const w =
    window.open(
      '',
      '_blank'
    );


  if(!w){

    alert(
      'Permití ventanas emergentes para imprimir el reporte.'
    );

    return;

  }


  w.document.write(`

<html>

<head>

<meta charset="utf-8">

<title>
Reporte ${esc(
  monthName(key)
)}
</title>

<style>

body{
  font-family:Arial;
  padding:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}

.cards{
  display:flex;
  gap:20px;
  margin:20px 0;
}

.card{
  border:1px solid #ddd;
  padding:12px;
  border-radius:8px;
}

</style>

</head>

<body>

<h1>
⚽ Mis Escuelas
</h1>

<h2>

${esc(
  currentSchool()
)}

·

${esc(
  monthName(key)
)}

</h2>


<div class="cards">

<div class="card">

Jugadores:
<b>
${list.length}
</b>

</div>


<div class="card">

Pagaron:
<b>
${paid}
</b>

</div>


<div class="card">

Recaudado:
<b>
${money(col)}
</b>

</div>


<div class="card">

Pendiente:
<b>
${money(
  Math.max(
    0,
    expected-col
  )
)}
</b>

</div>

</div>


<table>

<tr>

<th>
Jugador
</th>

<th>
Categoría
</th>

<th>
Medio
</th>

<th>
Fecha
</th>

<th>
Importe
</th>

</tr>


${
  rows ||

  `
    <tr>

      <td colspan="5">
        Sin pagos.
      </td>

    </tr>
  `
}

<script>

window.print();

<\/script>

</html>

`);


  w.document.close();

}


/* =====================================================
   FECHA
===================================================== */

function formatDate(v){

  if(!v)return '';

  const d =
    new Date(v);

  return isNaN(d)

    ? String(v)

    : d.toLocaleDateString(
        'es-AR'
      );

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

function setView(
  v,
  btn
){

  currentView =
    v;


  document
    .querySelectorAll(
      'nav button'
    )
    .forEach(
      b =>
        b.classList.remove(
          'active'
        )
    );


  if(btn){

    btn.classList.add(
      'active'
    );

  }


  render();

}


function setViewByName(v){

  currentView =
    v;


  document
    .querySelectorAll(
      'nav button'
    )
    .forEach(
      b =>
        b.classList.remove(
          'active'
        )
    );


  const target =
    v === 'reports'
      ? 'reportes'
      : v;


  const btn =
    [
      ...document.querySelectorAll(
        'nav button'
      )
    ].find(

      b =>
        b.textContent
          .toLowerCase()
          .includes(
            target
          )

    );


  if(btn){

    btn.classList.add(
      'active'
    );

  }


  render();

}


/* =====================================================
   MODAL
===================================================== */

function showModal(){

  document
    .getElementById(
      'modal'
    )
    .classList.add(
      'show'
    );

}


function closeModal(){

  document
    .getElementById(
      'modal'
    )
    .classList.remove(
      'show'
    );

}

   BORRAR DATOS
===================================================== */

function resetAll(){

  if(

    confirm(
      '¿Seguro? Se borrarán todos los datos de Mis Escuelas en este dispositivo.'
    )

  ){

    localStorage.removeItem(
      KEY
    );

    localStorage.removeItem(
      OLD_KEY
    );

    location.reload();

  }

}
