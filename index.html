<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mis Escuelas ⚽</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --green:#15803d;
  --red:#dc2626;
  --blue:#2563eb;
  --line:#e5e7eb;
  --amber:#b45309;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:90px;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 18px 18px;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:5px 0 0;
  color:#cbd5e1;
  font-size:14px;
}

main{
  max-width:760px;
  margin:auto;
  padding:15px;
}

.selector,.card{
  background:var(--card);
  border-radius:16px;
  box-shadow:0 2px 10px #0000000b;
}

.selector{
  padding:12px;
  margin-bottom:14px;
}

select,input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  font:inherit;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  padding:15px;
}

.metric{
  font-size:23px;
  font-weight:800;
  margin-top:4px;
}

.label{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:14px 0;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px;
  font:inherit;
  font-weight:750;
  background:#111827;
  color:#fff;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.green{background:var(--green)}
.blue{background:var(--blue)}
.danger{background:#b91c1c}
.amber{background:var(--amber)}

.ghost{
  background:#fff;
  color:#111827;
  border:1px solid var(--line);
}

.section{
  margin-top:14px;
}

.section h2{
  font-size:18px;
  margin:0 0 10px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.row .info{
  min-width:0;
}

.row b{
  display:block;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fee2e2;
  color:#991b1b;
}

.bluebadge{
  background:#dbeafe;
  color:#1e40af;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.search{
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:24px 8px;
}

.notice{
  border-radius:14px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
}

.notice.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
}

.notice.success{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  color:#065f46;
}

.notice.error{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.modal{
  display:none;
  position:fixed;
  z-index:20;
  inset:0;
  background:#0008;
  align-items:flex-end;
  padding:0;
}

.modal.show{
  display:flex;
}

.sheet{
  background:#fff;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin-top:0;
}

.field{
  margin:10px 0;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:10;
}

nav button{
  border:0;
  background:none;
  color:#6b7280;
  font:inherit;
  font-size:11px;
  cursor:pointer;
}

nav button.active{
  color:#111827;
  font-weight:800;
}

nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.table th,
.table td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.right{
  text-align:right!important;
}

.reportbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.mini{
  background:#f9fafb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.mini b{
  display:block;
  font-size:16px;
  margin-top:2px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:14px 0;
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.sync{
  font-size:12px;
  margin-top:8px;
}

@media(min-width:600px){
  .modal{
    align-items:center;
    padding:20px;
  }

  .sheet{
    border-radius:20px;
  }

  .actions{
    grid-template-columns:1fr 1fr 1fr;
  }

  .reportbar{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Mis Escuelas</h1>
  <p>Gestión de jugadores, cuotas, pagos e historial</p>
  <div id="syncStatus" class="sync">Conectando con Supabase...</div>
</header>

<main>

  <div class="selector">
    <div class="small">ESCUELA / SEDE</div>
    <select id="school"></select>
  </div>

  <div id="message"></div>

  <div id="app">
    <div class="loading">Cargando datos...</div>
  </div>

</main>

<div class="modal" id="modal">

  <div class="sheet">

    <h2 id="modalTitle"></h2>

    <div id="form"></div>

    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="saveForm()">
        Guardar
      </button>

      <button
        type="button"
        class="btn"
        onclick="closeModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>

<nav>

  <button type="button" class="active" onclick="setView('home',this)">
    <span>🏠</span>
    Inicio
  </button>

  <button type="button" onclick="setView('players',this)">
    <span>👥</span>
    Jugadores
  </button>

  <button type="button" onclick="setView('payments',this)">
    <span>💰</span>
    Cuotas
  </button>

  <button type="button" onclick="setView('reports',this)">
    <span>📊</span>
    Reportes
  </button>

  <button type="button" onclick="setView('settings',this)">
    <span>⚙️</span>
    Opciones
  </button>

</nav>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   CONFIGURACIÓN SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://inehoqxikbsuhguxxngz.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_sy4qDmB2FcYZ6hC_2IWJLA_H9u89I2h';


/* =========================================================
   CLIENTE SUPABASE
   ========================================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   DATOS LOCALES DE RESPALDO
   ========================================================= */

const LOCAL_KEY = 'misEscuelas_v4';

const DEFAULT_SCHOOLS = [
  'Semillitas',
  'La Cantera',
  'Nueva Escuela'
];

let data = {
  schools: [],
  players: [],
  payments: [],
  fees: {}
};

let currentView = 'home';
let editId = null;
let formType = null;
let reportMonth = monthKey();

let showInactive = false;

const school =
  document.getElementById('school');


/* =========================================================
   UTILIDADES
   ========================================================= */

const money = n =>
  new Intl.NumberFormat(
    'es-AR',
    {
      style:'currency',
      currency:'ARS',
      maximumFractionDigits:0
    }
  ).format(Number(n) || 0);


const esc = s =>
  String(s ?? '')
    .replace(
      /[&<>"']/g,
      m =>
        ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[m])
    );


const attr = s => esc(s);


function id(){

  return (
    'id_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function monthKey(d = new Date()){

  return (
    d.getFullYear() +
    '-' +
    String(d.getMonth()+1)
      .padStart(2,'0')
  );

}


function monthName(key = monthKey()){

  const [
    y,
    m
  ] =
    key
      .split('-')
      .map(Number);

  return new Date(
    y,
    m-1,
    1
  ).toLocaleDateString(
    'es-AR',
    {
      month:'long',
      year:'numeric'
    }
  );

}


function formatDate(v){

  if(!v)
    return '';

  const d = new Date(v);

  if(isNaN(d))
    return String(v);

  return d.toLocaleDateString('es-AR');

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function saveLocal(){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(data)
  );

}


function loadLocal(){

  try{

    const x =
      JSON.parse(
        localStorage.getItem(LOCAL_KEY)
      );

    if(x){

      data = x;

    }

  }catch(e){

    console.error(e);

  }

}


/* =========================================================
   MENSAJES
   ========================================================= */

function showMessage(text,type='info'){

  document.getElementById(
    'message'
  ).innerHTML =
    `
      <div class="notice ${type}">
        ${esc(text)}
      </div>
    `;

}


function clearMessage(){

  document.getElementById(
    'message'
  ).innerHTML = '';

}


/* =========================================================
   ESTADO DE SINCRONIZACIÓN
   ========================================================= */

function syncStatus(text){

  document.getElementById(
    'syncStatus'
  ).textContent = text;

}


/* =========================================================
   SUPABASE - CARGAR ESCUELAS
   ========================================================= */

async function loadSchools(){

  const result =
    await supabaseClient
      .from('schools')
      .select('*')
      .order('name');

  if(result.error){

    console.error(
      'schools:',
      result.error
    );

    return false;

  }

  const rows =
    result.data || [];

  if(rows.length){

    data.schools =
      rows.map(
        x => ({
          id: x.id,
          name:
            x.name ||
            x.nombre ||
            x.school_name ||
            ''
        })
      )
      .filter(x => x.name);

  }

  return true;

}


/* =========================================================
   SUPABASE - CARGAR JUGADORES
   ========================================================= */

async function loadPlayers(){

  const result =
    await supabaseClient
      .from('players')
      .select('*');

  if(result.error){

    console.error(
      'players:',
      result.error
    );

    return false;

  }

  const rows =
    result.data || [];

  data.players =
    rows.map(x => ({

      id:
        x.id,

      name:
        x.name ||
        x.nombre ||
        '',

      category:
        x.category ||
        x.categoria ||
        '',

      birth:
        x.birth ||
        x.birth_date ||
        x.fecha_nacimiento ||
        '',

      tutor:
        x.tutor ||
        x.parent ||
        x.padre ||
        '',

      phone:
        x.phone ||
        x.telefono ||
        '',

      active:
        x.active !== false,

      school:
        x.school ||
        x.school_name ||
        '',

      school_id:
        x.school_id ||
        null

    }));

  return true;

}


/* =========================================================
   SUPABASE - CARGAR PAGOS
   ========================================================= */

async function loadPayments(){

  const result =
    await supabaseClient
      .from('payments')
      .select('*');

  if(result.error){

    console.error(
      'payments:',
      result.error
    );

    return false;

  }

  const rows =
    result.data || [];

  data.payments =
    rows.map(x => ({

      id:
        x.id,

      playerId:
        x.player_id ||
        x.playerId,

      school:
        x.school ||
        x.school_name ||
        '',

      school_id:
        x.school_id ||
        null,

      monthKey:
        x.month_key ||
        x.monthKey ||
        '',

      month:
        x.month ||
        '',

      amount:
        Number(
          x.amount || 0
        ),

      method:
        x.method ||
        x.payment_method ||
        'No especificado',

      note:
        x.note ||
        '',

      date:
        x.date ||
        x.created_at ||
        new Date().toISOString()

    }));

  return true;

}


/* =========================================================
   SUPABASE - CARGAR CUOTAS
   ========================================================= */

async function loadFees(){

  const result =
    await supabaseClient
      .from('fees')
      .select('*');

  if(result.error){

    console.error(
      'fees:',
      result.error
    );

    return false;

  }

  const rows =
    result.data || [];

  data.fees = {};

  rows.forEach(x => {

    const schoolName =
      x.school ||
      x.school_name ||
      '';

    const key =
      x.month_key ||
      x.monthKey ||
      '';

    const amount =
      Number(
        x.amount ||
        x.value ||
        0
      );

    if(
      schoolName &&
      key
    ){

      if(!data.fees[schoolName])
        data.fees[schoolName] = {};

      data.fees[schoolName][key] =
        amount;

    }

  });

  return true;

}


/* =========================================================
   CARGA GENERAL DESDE SUPABASE
   ========================================================= */

async function loadFromSupabase(){

  syncStatus(
    '☁️ Cargando datos desde Supabase...'
  );

  let ok = true;

  const a =
    await loadSchools();

  const b =
    await loadPlayers();

  const c =
    await loadPayments();

  const d =
    await loadFees();

  if(!a || !b || !c || !d)
    ok = false;

  if(
    !data.schools.length
  ){

    data.schools =
      DEFAULT_SCHOOLS.map(
        name => ({
          id:null,
          name
        })
      );

  }

  saveLocal();

  if(ok){

    syncStatus(
      '☁️ Datos sincronizados con Supabase'
    );

  }else{

    syncStatus(
      '⚠️ Usando datos disponibles localmente'
    );

  }

  init();

}


/* =========================================================
   ESCUELA ACTUAL
   ========================================================= */

function currentSchool(){

  return (
    data.schools[
      Number(school.value) || 0
    ] || {
      id:null,
      name:''
    }
  );

}


function currentSchoolName(){

  return currentSchool().name;

}


function ps(){

  return data.players.filter(
    p =>
      (
        p.school === currentSchoolName() ||
        (
          p.school_id &&
          currentSchool().id &&
          String(p.school_id) ===
          String(currentSchool().id)
        )
      ) &&
      p.active !== false
  );

}


function allSchoolPlayers(){

  return data.players.filter(
    p =>
      p.school === currentSchoolName() ||
      (
        p.school_id &&
        currentSchool().id &&
        String(p.school_id) ===
        String(currentSchool().id)
      )
  );

}


/* =========================================================
   CUOTAS
   ========================================================= */

function fee(
  s=currentSchoolName(),
  key=monthKey()
){

  if(
    data.fees[s] &&
    data.fees[s][key] != null
  ){

    return Number(
      data.fees[s][key]
    );

  }

  return 20000;

}


function paymentFor(
  playerId,
  key=monthKey()
){

  return data.payments.find(
    p =>
      String(p.playerId) ===
      String(playerId) &&
      p.monthKey === key &&
      (
        p.school ===
        currentSchoolName() ||
        (
          p.school_id &&
          currentSchool().id &&
          String(p.school_id) ===
          String(currentSchool().id)
        )
      )
  );

}


function paymentsForMonth(
  key=reportMonth
){

  return data.payments.filter(
    p =>
      p.monthKey === key &&
      (
        p.school ===
        currentSchoolName() ||
        (
          p.school_id &&
          currentSchool().id &&
          String(p.school_id) ===
          String(currentSchool().id)
        )
      )
  );

}


/* =========================================================
   INSERTAR JUGADOR EN SUPABASE
   ========================================================= */

async function insertPlayer(obj){

  const row = {

    name:
      obj.name,

    category:
      obj.category,

    birth:
      obj.birth || null,

    tutor:
      obj.tutor,

    phone:
      obj.phone,

    active:
      obj.active,

    school:
      currentSchoolName()

  };

  if(
    currentSchool().id
  ){

    row.school_id =
      currentSchool().id;

  }

  const result =
    await supabaseClient
      .from('players')
      .insert(row)
      .select()
      .single();

  if(result.error){

    console.error(
      result.error
    );

    throw result.error;

  }

  return result.data;

}


/* =========================================================
   ACTUALIZAR JUGADOR
   ========================================================= */

async function updatePlayer(obj){

  const row = {

    name:
      obj.name,

    category:
      obj.category,

    birth:
      obj.birth || null,

    tutor:
      obj.tutor,

    phone:
      obj.phone,

    active:
      obj.active,

    school:
      currentSchoolName()

  };

  const result =
    await supabaseClient
      .from('players')
      .update(row)
      .eq('id',obj.id);

  if(result.error){

    console.error(
      result.error
    );

    throw result.error;

  }

}


/* =========================================================
   INSERTAR PAGO
   ========================================================= */

async function insertPayment(obj){

  const row = {

    player_id:
      obj.playerId,

    school:
      currentSchoolName(),

    month_key:
      obj.monthKey,

    month:
      monthName(obj.monthKey),

    amount:
      Number(obj.amount),

    method:
      obj.method,

    note:
      obj.note || '',

    date:
      new Date().toISOString()

  };

  if(
    currentSchool().id
  ){

    row.school_id =
      currentSchool().id;

  }

  const result =
    await supabaseClient
      .from('payments')
      .insert(row)
      .select()
      .single();

  if(result.error){

    console.error(
      result.error
    );

    throw result.error;

  }

  return result.data;

}


/* =========================================================
   GUARDAR CUOTA
   ========================================================= */

async function saveFeeToSupabase(
  schoolName,
  key,
  value
){

  const row = {

    school:
      schoolName,

    month_key:
      key,

    amount:
      Number(value)

  };

  if(
    currentSchool().id
  ){

    row.school_id =
      currentSchool().id;

  }

  const existing =
    await supabaseClient
      .from('fees')
      .select('id')
      .eq('school',schoolName)
      .eq('month_key',key)
      .maybeSingle();

  if(existing.error)
    throw existing.error;

  if(existing.data){

    const result =
      await supabaseClient
        .from('fees')
        .update({
          amount:
            Number(value)
        })
        .eq(
          'id',
          existing.data.id
        );

    if(result.error)
      throw result.error;

  }else{

    const result =
      await supabaseClient
        .from('fees')
        .insert(row);

    if(result.error)
      throw result.error;

  }

}


/* =========================================================
   VISTA
   ========================================================= */

function render(){

  if(
    currentView === 'home'
  )
    home();

  if(
    currentView === 'players'
  )
    players();

  if(
    currentView === 'payments'
  )
    payments();

  if(
    currentView === 'reports'
  )
    reports();

  if(
    currentView === 'settings'
  )
    settings();

}


/* =========================================================
   INICIO
   ========================================================= */

function home(){

  const list =
    ps();

  const key =
    monthKey();

  const paid =
    list.filter(
      p =>
        paymentFor(
          p.id,
          key
        )
    ).length;

  const collected =
    paymentsForMonth(key)
      .reduce(
        (a,p) =>
          a +
          Number(p.amount || 0),
        0
      );

  const expected =
    list.length *
    fee(
      currentSchoolName(),
      key
    );

  const pending =
    Math.max(
      0,
      expected-collected
    );

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="grid">

      <div class="card">
        <div class="label">
          Jugadores activos
        </div>

        <div class="metric">

function filterPlayers(){

    'playerList'

function reports(){

  const key =
    reportMonth ||
    monthKey();

  const list =
    ps();

  const pay =
    paymentsForMonth(key);

  const paidIds =
    new Set(
      pay.map(
        p => p.playerId
      )
    );

  const col =
    pay.reduce(
      (a,p) =>
        a +
        Number(p.amount || 0),
      0
    );

  const expected =
    list.length *
    fee(
      currentSchoolName(),
      key
    );

  const pending =
    Math.max(
      0,
      expected-col
    );

  const rate =
    list.length
      ? Math.round(
          paidIds.size /
          list.length *
          100
        )
      : 0;

  let methods = {};

  pay.forEach(
    p => {

      methods[p.method] =
        (

          p.amount || 0

      </div>

      <div class="mini">
        <span class="small">

        <b>
          ${money(pending)}
        </b>
      </div>

    </div>

    <div class="card">

      <h2 style="margin-top:0">
        📊 Resumen de
        ${esc(monthName(key))}
      </h2>

      <p class="small">

        Cuota:
        ${money(
          fee(
            currentSchoolName(),
            key
          )
        )}

      </p>

      <table class="table">

        <tr>
          <th>
            Medio de pago

          <th class="right">

        </tr>

        ${

/* =========================================================
   GUARDAR FORMULARIO
   ========================================================= */

async function saveForm(){

  try{

    if(
      formType === 'player'
    ){

      const name =
        document
          .getElementById(
            'f_name'
          )
          .value
          .trim();

      if(!name){

        alert(
          'Ingresá el nombre.'
        );

        return;

      }

      const obj = {

        id:
          editId,

        name,

        category:
          document
            .getElementById(
              'f_cat'
            )
            .value
            .trim(),

        birth:
          document
            .getElementById(
              'f_birth'
            )
            .value,

        tutor:
          document
            .getElementById(
              'f_tutor'
            )
            .value
            .trim(),

        phone:
          document
            .getElementById(
              'f_phone'
            )
            .value
            .trim(),

        active:
          document
            .getElementById(
              'f_active'
            )
            .value ===
          'true'

      };


      if(editId){

        await updatePlayer(
          obj
        );

      }else{

        await insertPlayer(
          obj
        );

      }


      showMessage(
        'Jugador guardado correctamente en Supabase.',
        'success'
      );

    }


    else{

      const pid =
        document
          .getElementById(
            'f_player'
          )
          .value;

      const key =
        document
          .getElementById(
            'f_month'
          )
          .value;

      const amount =
        Number(
          document
            .getElementById(
              'f_amount'
            )
            .value
        ) || 0;

      const method =
        document
          .getElementById(
            'f_method'
          )
          .value;

      const note =
        document
          .getElementById(
            'f_note'
          )
          .value
          .trim();


      if(
        !pid ||
        !key ||
        !amount
      ){

        alert(
          'Completá jugador, mes e importe.'
        );

        return;

      }


      if(
        paymentFor(
          pid,
          key
        )
      ){

        alert(
          'Ese jugador ya tiene un pago registrado para ese mes.'
        );

        return;

      }


      await insertPayment({

        playerId:
          pid,

        monthKey:
          key,

        amount,

        method,

        note

      });


      showMessage(
        'Pago registrado correctamente en Supabase.',
        'success'
      );

    }


    closeModal();

    await loadFromSupabase();

  }catch(error){

    console.error(error);

    alert(
      'No se pudo guardar en Supabase.\n\n' +
      (
        error.message ||
        'Revisá las políticas de acceso (RLS) y las columnas de la tabla.'
      )
    );

  }

}


/* =========================================================
   PAGO RÁPIDO
   ========================================================= */

async function quickPay(
  playerId,
  key=monthKey()
){

  try{

    if(
      paymentFor(
        playerId,
        key
      )
    ){

      alert(
        'Este jugador ya figura como pagado en ese mes.'
      );

      return;

    }

    const amount =
      fee(
        currentSchoolName(),
        key
      );

    await insertPayment({

      playerId,

      monthKey:
        key,

      amount,

      method:
        'No especificado',

      note:
        ''

    });

    await loadFromSupabase();

  }catch(error){

    console.error(error);

    alert(
      'No se pudo registrar el pago.\n\n' +
      (
        error.message ||
        'Revisá Supabase.'
      )
    );

  }

}


/* =========================================================
   GUARDAR CUOTA
   ========================================================= */

async function saveFee(){

  const v =
    Number(
      document
        .getElementById(
          'fee'
        )
        .value
    );

  const key =
    monthKey();

  if(!v){

    alert(
      'Ingresá una cuota válida.'
    );

    return;

  }

  try{

    await saveFeeToSupabase(
      currentSchoolName(),
      key,
      v
    );

    if(!data.fees[currentSchoolName()])
      data.fees[currentSchoolName()] = {};

    data.fees[currentSchoolName()][key] =
      v;

    saveLocal();

    showMessage(
      'Cuota guardada correctamente.',
      'success'
    );

    render();

  }catch(error){

    console.error(error);

    alert(
      'No se pudo guardar la cuota.\n\n' +
      (
        error.message ||
        'Revisá Supabase.'
      )
    );

  }

}

function addSchool(){

  const n =
    prompt(
      'Nombre de la nueva escuela / sede:'
    );

  if(!n || !n.trim())
    return;

  alert(
    'La escuela se agregará localmente. Para crear escuelas nuevas en Supabase necesitamos la estructura exacta de la tabla schools.'
  );

  data.schools.push({
    id:null,
    name:n.trim()
  });

  saveLocal();

  init();

}


function renameSchool(i){

  const old =
    data.schools[i];

  const n =
    prompt(
      'Nuevo nombre:',
      old.name
    );

  if(
    !n ||
    !n.trim()
  )
    return;

  const newName =
    n.trim();

  data.players.forEach(
    p => {

      if(
        p.school === old.name
      ){

        p.school =
          newName;

      }

    }
  );

  data.payments.forEach(
    p => {

      if(
        p.school === old.name
      ){

        p.school =
          newName;

      }

    }
  );

  if(
    data.fees[old.name]
  ){

    data.fees[newName] =
      data.fees[old.name];

    delete data.fees[old.name];

  }

  data.schools[i].name =
    newName;

  saveLocal();

  init();

}


/* =========================================================

/* =========================================================
   CSV
   ========================================================= */

function exportCSV(key){

  const rows =
    data.payments.filter(
      p =>
        p.school ===
        currentSchoolName() &&
        (
          !key ||
          p.monthKey === key
        )
    );

  const head = [
    'Fecha',
    'Mes',
    'Escuela',
    'Jugador',
    'Categoría',
    'Importe',
    'Medio de pago',
    'Observación'
  ];

  const out = [
    head,

    ...rows.map(
      x => {

        const p =
          data.players.find(
            q =>
              String(q.id) ===
              String(x.playerId)
          ) || {};

        return [
          formatDate(x.date),
          x.month,
          x.school,
          p.name || '',
          p.category || '',
          x.amount,
          x.method || '',
          x.note || ''
        ];

      }
    )
  ];

  const csv =
    '\ufeff' +
    out
      .map(
        r =>
          r
            .map(
              v =>
                '"' +
                String(
                  v ?? ''
                ).replace(
                  /"/g,
                  '""'
                ) +
                '"'
            )
            .join(';')
      )
      .join('\n');

  const blob =
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8'
      }
    );

  const a =
    document.createElement(
      'a'
    );

  a.href =
    URL.createObjectURL(
      blob
    );

  a.download =
    key
      ? `mis-escuelas-pagos-${key}.csv`
      : 'mis-escuelas-pagos.csv';

  a.click();

  setTimeout(
    () =>
      URL.revokeObjectURL(
        a.href
      ),
    500
  );

}

        a +
        Number(
          p.amount || 0
        ),
      0
    );

  const list =
    ps();

  const expected =
    list.length *
    fee(
      currentSchoolName(),
      key
    );

  const paid =
    new Set(
      pay.map(
        p => p.playerId
      )
    ).size;

  const rows =
    pay.map(
      x => {

        const p =
          data.players.find(
            q =>
              String(q.id) ===
              String(x.playerId)
          ) || {};

        return `

          <tr>

            <td>
              ${esc(p.name || '')}
            </td>

/* =========================================================
   NAVEGACIÓN
   ========================================================= */

function setView(
  v,
  btn
){

  currentView =
    v;

  document
    .querySelectorAll(
      'nav button'
    )
    .forEach(
      b =>
        b.classList.remove(
          'active'
        )
    );

  btn.classList.add(
    'active'
  );

  render();

}


function setViewByName(v){

  currentView =
    v;

  document
    .querySelectorAll(
      'nav button'
    )
    .forEach(
      b =>
        b.classList.remove(
          'active'
        )
    );

  const text =
    v === 'reports'
      ? 'reportes'
      : v;

  const btn =
    [
      ...document.querySelectorAll(
        'nav button'
      )
    ].find(
      b =>
        b.textContent
          .toLowerCase()
          .includes(text)
    );

  if(btn)
    btn.classList.add(
      'active'
    );

  render();

}


/* =========================================================
   MODAL
   ========================================================= */

function showModal(){

  document
    .getElementById(
      'modal'
    )
    .classList.add(
      'show'
    );

}


function closeModal(){

  document
    .getElementById(
      'modal'
    )
    .classList.remove(
      'show'
    );

}


/* =========================================================
   INICIALIZAR
   ========================================================= */

function init(){

  school.innerHTML =
    data.schools
      .map(
        (s,i) =>
          `
            <option value="${i}">
              ${esc(s.name)}
            </option>
          `
      )
      .join('');

  school.onchange =
    render;

  render();

}


/* =========================================================
   ARRANQUE
   ========================================================= */

async function start(){

  loadLocal();

  if(
    !data.schools.length
  ){

    data.schools =
      DEFAULT_SCHOOLS.map(
        name => ({
          id:null,
          name
        })
      );

  }

  init();

  try{

    await loadFromSupabase();

  }catch(error){

    console.error(error);

    syncStatus(
      '⚠️ No se pudo conectar con Supabase'
    );

    showMessage(
      'La aplicación abrió, pero Supabase no respondió. Los datos locales siguen protegidos.',
      'error'
    );

    render();

  }

}


start();
