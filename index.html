<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Escuelas ⚽ v3</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--green:#15803d;--red:#dc2626;--blue:#2563eb;--line:#e5e7eb;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{background:#111827;color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#cbd5e1;font-size:14px}
main{max-width:760px;margin:auto;padding:15px}.selector,.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #0000000b}.selector{padding:12px;margin-bottom:14px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric{font-size:23px;font-weight:800;margin-top:4px}.label{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{border:0;border-radius:11px;padding:12px;font:inherit;font-weight:750;background:#111827;color:#fff;cursor:pointer}.green{background:var(--green)}.blue{background:var(--blue)}.danger{background:#b91c1c}.amber{background:var(--amber)}.ghost{background:#fff;color:#111827;border:1px solid var(--line)}
.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .info{min-width:0}.row b{display:block}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.paid{background:#dcfce7;color:#166534}.pending{background:#fee2e2;color:#991b1b}.bluebadge{background:#dbeafe;color:#1e40af}.warn{background:#fef3c7;color:#92400e}
.search{margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:14px;padding:12px;font-size:13px;margin-top:12px}
.modal{display:none;position:fixed;z-index:20;inset:0;background:#0008;align-items:flex-end;padding:0}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#6b7280;font:inherit;font-size:11px;cursor:pointer}nav button.active{color:#111827;font-weight:800}nav span{display:block;font-size:20px;margin-bottom:2px}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.right{text-align:right!important}.reportbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.mini{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px}.mini b{display:block;font-size:16px;margin-top:2px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.divider{height:1px;background:var(--line);margin:14px 0}
@media(min-width:600px){.modal{align-items:center;padding:20px}.sheet{border-radius:20px}.actions{grid-template-columns:1fr 1fr 1fr}.reportbar{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>⚽ Mis Escuelas</h1><p>Gestión de jugadores, cuotas, historial y comprobantes · v3</p></header>
<main>
  <div class="selector"><div class="small">ESCUELA / SEDE</div><select id="school"></select></div>
  <div id="app"></div>
</main>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="form"></div><div class="actions"><button class="btn green" onclick="saveForm()">Guardar</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div></div>
<nav>
<button type="button" class="active" onclick="setView('home',this)"><span>🏠</span>Inicio</button>
<button type="button" onclick="setView('players',this)"><span>👥</span>Jugadores</button>
<button type="button" onclick="setView('payments',this)"><span>💰</span>Cuotas</button>
<button type="button" onclick="setView('reports',this)"><span>📊</span>Reportes</button>
<button type="button" onclick="setView('settings',this)"><span>⚙️</span>Opciones</button>
</nav>
<script> const SUPABASE_URL = 'https://inehoqxikbsuhguxxngz.supabase.co';
const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY';
const KEY='misEscuelas_v3';
const OLD_KEY='misEscuelas_v2';
const DEFAULT_SCHOOLS=['Semillitas','La Cantera','Nueva Escuela'];
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!data){
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
  data=old||{schools:DEFAULT_SCHOOLS,players:[],payments:[],expenses:[],fees:{}};
  data.schools=[...new Set([...DEFAULT_SCHOOLS,...(data.schools||[])])];
  data.players=data.players||[];data.payments=data.payments||[];data.expenses=data.expenses||[];data.fees=data.fees||{};data.feeHistory=data.feeHistory||{};
  localStorage.setItem(KEY,JSON.stringify(data));
}else{data.schools=[...new Set([...DEFAULT_SCHOOLS,...(data.schools||[])])];data.players=data.players||[];data.payments=data.payments||[];data.expenses=data.expenses||[];data.fees=data.fees||{};data.feeHistory=data.feeHistory||{};}
let currentView='home',editId=null,formType=null,reportMonth=monthKey();
const school=document.getElementById('school');
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const attr=s=>esc(s);
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function id(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function init(){school.innerHTML=data.schools.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('');school.onchange=render;render()}
function currentSchool(){return data.schools[Number(school.value)||0]}
function ps(){return data.players.filter(p=>p.school===currentSchool() && p.active!==false)}
function allSchoolPlayers(){return data.players.filter(p=>p.school===currentSchool())}
function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthName(key=monthKey()){let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})}
function fee(s=currentSchool(),key=monthKey()){
  const h=data.feeHistory[s]||{};
  return Number(h[key]??data.fees[s]??20000)
}
function setFeeForMonth(s,key,value){data.feeHistory[s]=data.feeHistory[s]||{};data.feeHistory[s][key]=Number(value);data.fees[s]=Number(value)}
function paymentFor(id,key=monthKey()){return data.payments.find(p=>p.playerId===id&&p.school===currentSchool()&&p.monthKey===key)}
function paymentsForMonth(key=reportMonth){return data.payments.filter(p=>p.school===currentSchool()&&p.monthKey===key)}
function render(){if(currentView==='home')home();if(currentView==='players')players();if(currentView==='payments')payments();if(currentView==='reports')reports();if(currentView==='settings')settings()}
function home(){
 const list=ps(), key=monthKey(), paid=list.filter(p=>paymentFor(p.id,key)).length, collected=paymentsForMonth(key).reduce((a,p)=>a+Number(p.amount||0),0), expected=list.length*fee(currentSchool(),key), pending=Math.max(0,expected-collected);
 document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Jugadores activos</div><div class="metric">${list.length}</div></div><div class="card"><div class="label">Pagaron ${esc(monthName(key))}</div><div class="metric">${paid}</div></div><div class="card"><div class="label">Recaudado</div><div class="metric">${money(collected)}</div></div><div class="card"><div class="label">Pendiente estimado</div><div class="metric">${money(pending)}</div></div></div>
 <div class="actions"><button class="btn green" onclick="openPlayer()">＋ Agregar jugador</button><button class="btn blue" onclick="openPayment()">✓ Registrar pago</button><button class="btn amber" onclick="setViewByName('reports')">📊 Ver reporte</button></div>
 <div class="card section"><h2>📅 Cuota de ${esc(monthName(key))}</h2>${pendingRows(list,key)}</div>
 <div class="notice">💡 Cuota del mes: <b>${money(fee(currentSchool(),key))}</b>. Podés cambiarla desde ⚙️ Opciones. La app guarda los datos en este dispositivo y conserva el historial mensual.</div>`;
}
function pendingRows(list,key){const pend=list.filter(p=>!paymentFor(p.id,key));if(!pend.length)return '<div class="empty">🎉 Todos los jugadores están al día.</div>';return pend.map(p=>`<div class="row"><div class="info"><b>${esc(p.name)}</b><span class="small">${esc(p.category||'Sin categoría')}</span></div><button class="btn green" style="padding:8px 10px" onclick="quickPay('${p.id}')">Pagó</button></div>`).join('')}
function players(){const list=allSchoolPlayers();document.getElementById('app').innerHTML=`<div class="actions"><button class="btn green" onclick="openPlayer()">＋ Nuevo jugador</button><button class="btn ghost" onclick="toggleInactive()">👤 Ver activos/inactivos</button></div><input class="search" id="search" placeholder="🔎 Buscar jugador..." oninput="filterPlayers()"><div class="card" id="playerList">${playerRows(list)}</div>`}
let showInactive=false;function toggleInactive(){showInactive=!showInactive;render()}
function playerRows(list){if(!list.length)return '<div class="empty">No hay jugadores en esta escuela.</div>';let view=showInactive?list:list.filter(p=>p.active!==false);if(!view.length)return '<div class="empty">No hay jugadores activos.</div>';return view.map(p=>`<div class="row"><div class="info"><b>${esc(p.name)} ${p.active===false?'<span class="badge warn">INACTIVO</span>':''}</b><span class="small">${esc(p.category||'Sin categoría')} · ${esc(p.phone||'Sin teléfono')}</span></div><button class="btn" style="padding:8px 10px" onclick="openPlayer('${p.id}')">Editar</button></div>`).join('')}
function filterPlayers(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('playerList').innerHTML=playerRows(allSchoolPlayers().filter(p=>(p.name+' '+p.category+' '+p.phone).toLowerCase().includes(q)))}
function payments(){let key=monthKey(),list=ps(),paid=list.filter(p=>paymentFor(p.id,key)).length;document.getElementById('app').innerHTML=`<div class="card"><div class="two"><div class="field"><label>Mes a consultar</label><input type="month" id="payMonth" value="${key}" onchange="renderPaymentsMonth()"></div><div class="field"><label>Cuota aplicada</label><input value="${money(fee(currentSchool(),key))}" disabled></div></div></div><div id="paymentsBody"></div>`;renderPaymentsMonth()}
function renderPaymentsMonth(){let key=document.getElementById('payMonth').value||monthKey(),list=ps(),rows=list.map(p=>{let x=paymentFor(p.id,key);return `<div class="row"><div class="info"><b>${esc(p.name)}</b><span class="small">${x?money(x.amount)+' · '+esc(x.method)+' · '+formatDate(x.date):'Sin pago registrado'}</span></div>${x?`<div><span class="badge paid">PAGADA</span><button class="btn ghost" style="padding:7px 9px;margin-left:5px" onclick="receipt('${x.id}')">🧾</button></div>`:`<button class="btn green" style="padding:8px 10px" onclick="quickPay('${p.id}','${key}')">Pagó</button>`}</div>`}).join('');document.getElementById('paymentsBody').innerHTML=`<div class="actions"><button class="btn blue" onclick="openPayment(null,'${key}')">＋ Registrar pago</button><button class="btn ghost" onclick="exportCSV('${key}')">📥 Exportar mes</button></div><div class="card"><h2 style="margin-top:0">Cuotas · ${esc(monthName(key))}</h2>${rows||'<div class="empty">No hay jugadores.</div>'}</div>`}
function reports(){let key=reportMonth||monthKey();let list=ps(),pay=paymentsForMonth(key),paidIds=new Set(pay.map(p=>p.playerId)),col=pay.reduce((a,p)=>a+Number(p.amount||0),0),expected=list.length*fee(currentSchool(),key),pending=Math.max(0,expected-col),rate=list.length?Math.round(paidIds.size/list.length*100):0;let methods={};pay.forEach(p=>methods[p.method]=(methods[p.method]||0)+Number(p.amount||0));document.getElementById('app').innerHTML=`<div class="card"><div class="field"><label>Reporte mensual</label><input type="month" id="reportMonth" value="${key}" onchange="reportMonth=this.value;render()"></div></div><div class="reportbar section"><div class="mini"><span class="small">Jugadores</span><b>${list.length}</b></div><div class="mini"><span class="small">Pagaron</span><b>${paidIds.size} (${rate}%)</b></div><div class="mini"><span class="small">Recaudado</span><b>${money(col)}</b></div><div class="mini"><span class="small">Pendiente</span><b>${money(pending)}</b></div></div><div class="card"><h2 style="margin-top:0">📊 Resumen de ${esc(monthName(key))}</h2><p class="small">Cuota tomada para el cálculo: ${money(fee(currentSchool(),key))}</p><table class="table"><tr><th>Medio de pago</th><th class="right">Importe</th></tr>${Object.keys(methods).length?Object.entries(methods).map(([m,v])=>`<tr><td>${esc(m)}</td><td class="right">${money(v)}</td></tr>`).join(''):'<tr><td colspan="2">Sin pagos registrados.</td></tr>'}</table><div class="divider"></div><div class="actions"><button class="btn blue" onclick="exportCSV('${key}')">📥 Exportar CSV</button><button class="btn green" onclick="printReport('${key}')">🖨️ Imprimir reporte</button><button class="btn ghost" onclick="backup()">💾 Copia de seguridad</button></div></div><div class="card section"><h2 style="margin-top:0">Detalle de pagos</h2>${pay.length?pay.map(x=>{let p=data.players.find(q=>q.id===x.playerId);return `<div class="row"><div class="info"><b>${esc(p?p.name:'Jugador eliminado')}</b><span class="small">${esc(x.method)} · ${formatDate(x.date)} · ${money(x.amount)}</span></div><button class="btn ghost" style="padding:7px 9px" onclick="receipt('${x.id}')">🧾 Comprobante</button></div>`}).join(''):'<div class="empty">No hay pagos para este mes.</div>'}</div>`}
function settings(){let s=currentSchool(),key=monthKey(),history=Object.entries(data.feeHistory[s]||{}).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('app').innerHTML=`<div class="card"><h2 style="margin-top:0">⚙️ Configuración</h2><div class="field"><label>Cuota para ${esc(monthName(key))}</label><input id="fee" type="number" inputmode="decimal" value="${fee(s,key)}"></div><button class="btn green" style="width:100%" onclick="saveFee()">Guardar cuota del mes</button><p class="small">Al guardar, el valor queda asociado al mes actual. Los meses anteriores conservan su importe histórico.</p></div><div class="card section"><h2 style="margin-top:0">🗓️ Historial de cuotas</h2>${history.length?history.map(([k,v])=>`<div class="row"><div class="info"><b>${esc(monthName(k))}</b><span class="small">Cuota registrada</span></div><span class="badge bluebadge">${money(v)}</span></div>`).join(''):'<div class="empty">Todavía no hay historial de cuotas.</div>'}</div><div class="card section"><h2 style="margin-top:0">Escuelas / sedes</h2>${data.schools.map((x,i)=>`<div class="row"><div class="info"><b>${esc(x)}</b></div><button class="btn" style="padding:8px 10px" onclick="renameSchool(${i})">Renombrar</button></div>`).join('')}<div class="actions"><button class="btn green" onclick="addSchool()">＋ Agregar escuela</button><button class="btn" onclick="backup()">💾 Copia</button></div></div><div class="card section"><h2 style="margin-top:0">📤 Exportación</h2><p class="small">Podés exportar todos los pagos registrados a CSV o hacer una copia completa en JSON para restaurarla en otro dispositivo.</p><div class="actions"><button class="btn blue" onclick="exportCSV()">📥 Exportar todos los pagos</button><button class="btn ghost" onclick="backup()">💾 Backup completo</button></div></div><div class="card section"><h2 style="margin-top:0">📱 Usarla como app</h2><p class="small">Abrí este archivo en Safari o publicalo en GitHub Pages. Los datos se guardan en el navegador mediante localStorage.</p></div><div class="card section"><h2 style="margin-top:0">Datos</h2><button class="btn danger" style="width:100%" onclick="resetAll()">Borrar datos</button></div>`}
function openPlayer(id){editId=id||null;formType='player';let p=id?data.players.find(x=>x.id===id):{};document.getElementById('modalTitle').textContent=id?'Editar jugador':'Nuevo jugador';document.getElementById('form').innerHTML=`<div class="field"><label>Nombre y apellido *</label><input id="f_name" value="${attr(p.name||'')}"></div><div class="field"><label>Categoría</label><input id="f_cat" placeholder="Ej. Sub 14" value="${attr(p.category||'')}"></div><div class="field"><label>Fecha de nacimiento</label><input id="f_birth" type="date" value="${attr(p.birth||'')}"></div><div class="field"><label>Padre / madre / tutor</label><input id="f_tutor" value="${attr(p.tutor||'')}"></div><div class="field"><label>Teléfono</label><input id="f_phone" inputmode="tel" value="${attr(p.phone||'')}"></div><div class="field"><label>Estado</label><select id="f_active"><option value="true" ${(p.active!==false)?'selected':''}>Activo</option><option value="false" ${p.active===false?'selected':''}>Inactivo</option></select></div>`;showModal()}
function openPayment(playerId,key=monthKey()){formType='payment';editId=null;let list=ps();document.getElementById('modalTitle').textContent='Registrar cuota';document.getElementById('form').innerHTML=`<div class="field"><label>Jugador *</label><select id="f_player">${list.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Mes</label><input id="f_month" type="month" value="${key}"></div><div class="field"><label>Importe</label><input id="f_amount" type="number" inputmode="decimal" value="${fee(currentSchool(),key)}"></div><div class="field"><label>Medio de pago</label><select id="f_method"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Otro</option></select></div><div class="field"><label>Observación</label><input id="f_note" placeholder="Opcional"></div>`;showModal()}
function quickPay(playerId,key=monthKey()){if(paymentFor(playerId,key)){alert('Este jugador ya figura como pagado en ese mes.');return}let amount=fee(currentSchool(),key);data.payments.push({id:id(),playerId,school:currentSchool(),month:monthName(key),monthKey:key,amount,method:'No especificado',note:'',date:new Date().toISOString()});persist();render()}
function saveForm(){if(formType==='player'){let name=document.getElementById('f_name').value.trim();if(!name)return alert('Ingresá el nombre.');let obj={id:editId||id(),name,category:document.getElementById('f_cat').value.trim(),birth:document.getElementById('f_birth').value,tutor:document.getElementById('f_tutor').value.trim(),phone:document.getElementById('f_phone').value.trim(),school:currentSchool(),active:document.getElementById('f_active').value==='true'};if(editId){let i=data.players.findIndex(x=>x.id===editId);data.players[i]=obj}else data.players.push(obj)}else{let pid=document.getElementById('f_player').value,key=document.getElementById('f_month').value,amount=Number(document.getElementById('f_amount').value)||0;if(!pid||!key||!amount)return alert('Completá jugador, mes e importe.');if(paymentFor(pid,key))return alert('Ese jugador ya tiene un pago registrado para ese mes.');data.payments.push({id:id(),playerId:pid,school:currentSchool(),month:monthName(key),monthKey:key,amount,method:document.getElementById('f_method').value,note:document.getElementById('f_note').value.trim(),date:new Date().toISOString()})}persist();closeModal();render()}
function saveFee(){let v=Number(document.getElementById('fee').value),key=monthKey();if(!v)return alert('Ingresá una cuota válida.');setFeeForMonth(currentSchool(),key,v);persist();render()}
function addSchool(){let n=prompt('Nombre de la nueva escuela / sede:');if(n&&n.trim()){data.schools.push(n.trim());persist();init();school.value=data.schools.length-1;render()}}
function renameSchool(i){let old=data.schools[i],n=prompt('Nuevo nombre:',old);if(n&&n.trim()){data.schools[i]=n.trim();data.players.forEach(p=>{if(p.school===old)p.school=n.trim()});data.payments.forEach(p=>{if(p.school===old)p.school=n.trim()});if(data.fees[old]!=null){data.fees[n.trim()]=data.fees[old];delete data.fees[old]}if(data.feeHistory[old]){data.feeHistory[n.trim()]=data.feeHistory[old];delete data.feeHistory[old]}persist();init()}}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mis-escuelas-v3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportCSV(key){let rows=data.payments.filter(p=>p.school===currentSchool()&&(!key||p.monthKey===key));let head=['Fecha','Mes','Escuela','Jugador','Categoría','Importe','Medio de pago','Observación'];let out=[head,...rows.map(x=>{let p=data.players.find(q=>q.id===x.playerId)||{};return [formatDate(x.date),x.month,x.school,p.name||'',p.category||'',x.amount,x.method||'',x.note||'']} )];let csv='\ufeff'+out.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=key?`mis-escuelas-pagos-${key}.csv`:'mis-escuelas-todos-los-pagos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function receipt(paymentId){let pmt=data.payments.find(x=>x.id===paymentId);if(!pmt)return;let p=data.players.find(x=>x.id===pmt.playerId)||{};let html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comprobante - Mis Escuelas</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111827;max-width:520px;margin:auto}.box{border:1px solid #ddd;border-radius:14px;padding:24px}h1{margin:0 0 5px}h2{margin-top:25px;border-bottom:1px solid #ddd;padding-bottom:8px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.total{font-size:24px;font-weight:bold;margin-top:20px}.muted{color:#666;font-size:12px}button{margin-top:20px;padding:10px 16px;border:0;border-radius:8px;background:#111827;color:white}@media print{button{display:none}body{padding:0}}</style></head><body><div class="box"><h1>⚽ Mis Escuelas</h1><div class="muted">Comprobante de pago</div><h2>${esc(pmt.school)}</h2><div class="row"><span>Jugador</span><b>${esc(p.name||'')}</b></div><div class="row"><span>Categoría</span><span>${esc(p.category||'')}</span></div><div class="row"><span>Período</span><span>${esc(pmt.month||pmt.monthKey)}</span></div><div class="row"><span>Medio de pago</span><span>${esc(pmt.method||'')}</span></div><div class="row"><span>Fecha</span><span>${formatDate(pmt.date)}</span></div>${pmt.note?`<div class="row"><span>Observación</span><span>${esc(pmt.note)}</span></div>`:''}<div class="total">Total: ${money(pmt.amount)}</div><button onclick="window.print()">Imprimir / Guardar PDF</button></div></body></html>`;let w=window.open('','_blank');if(!w){alert('El navegador bloqueó la ventana del comprobante. Permití ventanas emergentes para este sitio.');return}w.document.write(html);w.document.close()}
function printReport(key){let pay=paymentsForMonth(key),col=pay.reduce((a,p)=>a+Number(p.amount||0),0),list=ps(),expected=list.length*fee(currentSchool(),key),paid=new Set(pay.map(p=>p.playerId)).size;let rows=pay.map(x=>{let p=data.players.find(q=>q.id===x.playerId)||{};return `<tr><td>${esc(p.name||'')}</td><td>${esc(p.category||'')}</td><td>${esc(x.method||'')}</td><td>${formatDate(x.date)}</td><td>${money(x.amount)}</td></tr>`}).join('');let w=window.open('','_blank');if(!w){alert('Permití ventanas emergentes para imprimir el reporte.');return}w.document.write(`<html><head><meta charset="utf-8"><title>Reporte ${esc(monthName(key))}</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.cards{display:flex;gap:20px;margin:20px 0}.card{border:1px solid #ddd;padding:12px;border-radius:8px}.right{text-align:right}</style></head><body><h1>⚽ Mis Escuelas</h1><h2>${esc(currentSchool())} · ${esc(monthName(key))}</h2><div class="cards"><div class="card">Jugadores: <b>${list.length}</b></div><div class="card">Pagaron: <b>${paid}</b></div><div class="card">Recaudado: <b>${money(col)}</b></div><div class="card">Pendiente: <b>${money(Math.max(0,expected-col))}</b></div></div><table><tr><th>Jugador</th><th>Categoría</th><th>Medio</th><th>Fecha</th><th>Importe</th></tr>${rows||'<tr><td colspan="5">Sin pagos.</td></tr>'}</table><script>window.print()<\/script></body></html>`);w.document.close()}
function formatDate(v){if(!v)return '';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('es-AR')}
function setView(v,btn){currentView=v;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function setViewByName(v){currentView=v;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));let btn=[...document.querySelectorAll('nav button')].find(b=>b.textContent.toLowerCase().includes(v==='reports'?'reportes':v));if(btn)btn.classList.add('active');render()}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function resetAll(){if(confirm('¿Seguro? Se borrarán todos los datos de Mis Escuelas en este dispositivo.')){localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);location.reload()}}
init();
</script>
</body>
</html>
