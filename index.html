"use strict";


/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://inehoqxikbsuhguxxngz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sy4qDmB2FcYZ6hC_2IWJLA_H9u89I2h";


/* =========================================================
   ESTADO DE LA APLICACIÓN
========================================================= */

let supabaseClient = null;

let data = {
  schools: [],
  players: [],
  fees: [],
  pagos: []
};

let currentView = "home";

let currentSchool = "";

let editingPlayerId = null;


/* =========================================================
   INICIO
========================================================= */

document.addEventListener("DOMContentLoaded", init);


async function init(){

  console.log("MIS ESCUELAS: INICIANDO");

  try{

    if(!window.supabase){

      throw new Error(
        "No se pudo cargar la biblioteca de Supabase."
      );

    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    connectEvents();


    await loadData();


  }catch(error){

    console.error(
      "ERROR DE INICIO:",
      error
    );

    showFatalError(error);

  }

}


/* =========================================================
   EVENTOS
========================================================= */

function connectEvents(){

  document
    .querySelectorAll("nav button")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          setView(
            this.dataset.view,
            this
          );

        }
      );

    });


  document
    .getElementById("school")
    .addEventListener(
      "change",
      function(){

        currentSchool =
          this.value;

        render();

      }
    );


  document
    .getElementById("saveFormButton")
    .addEventListener(
      "click",
      saveForm
    );


  document
    .getElementById("closeModalButton")
    .addEventListener(
      "click",
      closeModal
    );

}


/* =========================================================
   UTILIDADES
========================================================= */

function money(value){

  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:0
    }
  ).format(
    Number(value) || 0
  );

}


function monthKey(date = new Date()){

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0")
  );

}


function monthName(key){

  const parts =
    key.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  return new Date(
    year,
    month - 1,
    1
  ).toLocaleDateString(
    "es-AR",
    {
      month:"long",
      year:"numeric"
    }
  );

}


function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function showMessage(
  text,
  type = "success"
){

  const box =
    document.getElementById(
      "message"
    );

  box.innerHTML =
    `<div class="${type}">
       ${esc(text)}
     </div>`;

  setTimeout(
    () => {
      box.innerHTML = "";
    },
    5000
  );

}


function showFatalError(error){

  const message =
    error?.message ||
    String(error);

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h2>
        ⚠️ Error al iniciar
      </h2>

      <p>
        La aplicación pudo cargar,
        pero no pudo iniciar correctamente.
      </p>

      <div class="error">
        ${esc(message)}
      </div>

      <button
        type="button"
        class="btn blue"
        id="retryButton">

        🔄 Intentar nuevamente

      </button>

    </div>
  `;


  document
    .getElementById("retryButton")
    .addEventListener(
      "click",
      () => location.reload()
    );

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadData(){

  if(!supabaseClient){

    throw new Error(
      "Supabase todavía no está conectado."
    );

  }


  showMessage(
    "Conectando con Supabase...",
    "success"
  );


  try{

    const schoolsResult =
      await supabaseClient
        .from("schools")
        .select("*");


    if(schoolsResult.error){

      throw new Error(
        "Tabla schools: " +
        schoolsResult.error.message
      );

    }


    const playersResult =
      await supabaseClient
        .from("players")
        .select("*");


    if(playersResult.error){

      throw new Error(
        "Tabla players: " +
        playersResult.error.message
      );

    }


    const feesResult =
      await supabaseClient
        .from("fees")
        .select("*");


    if(feesResult.error){

      throw new Error(
        "Tabla fees: " +
        feesResult.error.message
      );

    }


    const pagosResult =
      await supabaseClient
        .from("pagos")
        .select("*");


    if(pagosResult.error){

      throw new Error(
        "Tabla pagos: " +
        pagosResult.error.message
      );

    }


    data.schools =
      schoolsResult.data || [];

    data.players =
      playersResult.data || [];

    data.fees =
      feesResult.data || [];

    data.pagos =
      pagosResult.data || [];


    prepareSchools();

    render();


    showMessage(
      "Datos sincronizados correctamente.",
      "success"
    );


  }catch(error){

    console.error(
      "ERROR SUPABASE:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          ⚠️ No se pudieron cargar los datos
        </h2>

        <p>
          La página funciona, pero
          Supabase rechazó alguna operación.
        </p>

        <div class="error">
          <b>Mensaje recibido:</b><br><br>
          ${esc(error.message || error)}
        </div>

        <button
          type="button"
          class="btn blue"
          id="retryDataButton">

          🔄 Reintentar

        </button>

      </div>
    `;


    document
      .getElementById(
        "retryDataButton"
      )
      .addEventListener(
        "click",
        loadData
      );

  }

}


/* =========================================================
   ESCUELAS
========================================================= */

function prepareSchools(){

  const select =
    document.getElementById(
      "school"
    );


  if(!data.schools.length){

    select.innerHTML =
      `<option value="">
        Sin escuelas
       </option>`;

    currentSchool = "";

    return;

  }


  select.innerHTML =
    data.schools
      .map(
        school => {

          const name =
            school.name ||
            school.nombre ||
            school.school ||
            "";


          return `
            <option value="${esc(name)}">
              ${esc(name)}
            </option>
          `;

        }
      )
      .join("");


  const exists =
    data.schools.some(
      school => {

        const name =
          school.name ||
          school.nombre ||
          school.school ||
          "";

        return name === currentSchool;

      }
    );


  if(!exists){

    const first =
      data.schools[0];

    currentSchool =
      first.name ||
      first.nombre ||
      first.school ||
      "";

  }


  select.value =
    currentSchool;

}


/* =========================================================
   JUGADORES
========================================================= */

function schoolPlayers(){

  return data.players.filter(
    player => {

      const school =
        player.school ||
        player.school_name ||
        player.escuela ||
        "";

      return school === currentSchool;

    }
  );

}


function activePlayers(){

  return schoolPlayers()
    .filter(
      player =>
        player.active !== false
    );

}


/* =========================================================
   PAGOS
========================================================= */

function playerPayment(
  playerId,
  key
){

  return data.pagos.find(
    payment => {

      const id =
        payment.player_id ??
        payment.playerId;

      const month =
        payment.month_key ??
        payment.monthKey;

      const school =
        payment.school ??
        payment.escuela ??
        "";

      return (
        String(id) === String(playerId) &&
        month === key &&
        school === currentSchool
      );

    }
  );

}


/* =========================================================
   CUOTA
========================================================= */

function currentFee(
  key = monthKey()
){

  const fee =
    data.fees.find(
      item => {

        const school =
          item.school ??
          item.escuela ??
          item.school_name ??
          "";

        const month =
          item.month_key ??
          item.monthKey ??
          item.mes ??
          "";

        return (
          school === currentSchool &&
          month === key
        );

      }
    );


  if(fee){

    return Number(
      fee.amount ??
      fee.monto ??
      fee.fee ??
      0
    );

  }


  return 20000;

}


/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render(){

  if(!currentSchool){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <div class="empty">

          No hay ninguna escuela disponible.

          <br><br>

          Verificá la tabla
          <b>schools</b> en Supabase.

        </div>

      </div>

    `;

    return;

  }


  if(currentView === "home"){

    renderHome();

  }else if(currentView === "players"){

    renderPlayers();

  }else if(currentView === "payments"){

    renderPayments();

  }else if(currentView === "settings"){

    renderSettings();

  }

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function setView(
  view,
  button
){

  currentView =
    view;


  document
    .querySelectorAll("nav button")
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  if(button){

    button.classList.add(
      "active"
    );

  }


  render();

}


/* =========================================================
   INICIO
========================================================= */

function renderHome(){

  const key =
    monthKey();

  const players =
    activePlayers();


  const paid =
    players.filter(
      player =>
        playerPayment(
          player.id,
          key
        )
    ).length;


  const collected =
    data.pagos
      .filter(
        payment => {

          const school =
            payment.school ??
            payment.escuela ??
            "";

          const month =
            payment.month_key ??
            payment.monthKey;

          return (
            school === currentSchool &&
            month === key
          );

        }
      )
      .reduce(
        (total,payment) => {

          return (
            total +
            Number(
              payment.amount ??
              payment.monto ??
              0
            )
          );

        0

    );

        </div>

        <div class="metric">

        </div>

      </div>


      <div class="card">

        <div class="label">

        </div>

        <div class="metric">
          ${money(collected)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Pendiente
        </div>

        <div class="metric">
          ${money(pending)}
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        type="button"
        class="btn green"
        id="addPlayerButton">

        ＋ Agregar jugador

      </button>


      <button
        type="button"
        class="btn blue"
        id="addPaymentButton">

        ✓ Registrar pago

      </button>

    </div>


    <div class="card section">

      <h2>
        📅 Cuotas de ${esc(
          monthName(key)
        )}
      </h2>

      ${pendingRows(
        players,
        key
      )}

    </div>


    <div class="notice">

      💰 Cuota actual:
      <b>${money(
        currentFee(key)
      )}</b>

      <br><br>

      Escuela:
      <b>${esc(
        currentSchool
      )}</b>

    </div>

  `;


  document
    .getElementById(
      "addPlayerButton"
    )
    .addEventListener(
      "click",
      () => openPlayer()
    );


  document
    .getElementById(
      "addPaymentButton"
    )
    .addEventListener(
      "click",
      () => openPayment()
    );


  document
    .querySelectorAll(
      "[data-quick-pay]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            quickPay(
              button.dataset.quickPay,
              key
            )
        );

      }
    );

}


function pendingRows(
  players,
  key
){

  const pending =
    players.filter(
      player =>
        !playerPayment(
          player.id,
          key
        )
    );


  if(!pending.length){

    return `
      <div class="empty">
        🎉 Todos los jugadores
        están al día.
      </div>
    `;

  }


  return pending
    .map(
      player => `

        <div class="row">

          <div class="info">

            <b>
              ${esc(player.name)}
            </b>

            <span class="small">
              ${esc(

            style="padding:8px 10px"
            data-quick-pay="${esc(player.id)}">

            Pagó

          </button>

      `
    )
    .join("");

}

function playerRows(players){

  if(!players.length){

    return `
      <div class="empty">
        No hay jugadores
        en esta escuela.
      </div>
    `;

  }


  return players
    .map(
      player => `

        <div class="row">

          <div class="info">

            <b>

              ${esc(
                player.name ||
                "Sin nombre"
              )}

              ${
                player.active === false
                  ? `
                    <span class="badge warn">
                      INACTIVO
                    </span>
                  `

async function savePlayer(){

  const name =
    document
      .getElementById(
        "f_name"
      )
      .value
      .trim();


  if(!name){

    alert(
      "Ingresá el nombre del jugador."
    );

    return;

  }


  const playerData = {

    name:name,

    category:
      document
        .getElementById(
          "f_category"
        )
        .value
        .trim(),

    birth:
      document
        .getElementById(
          "f_birth"
        )
        .value ||
      null,

    tutor:
      document
        .getElementById(
          "f_tutor"
        )
        .value
        .trim(),

    phone:
      document
        .getElementById(
          "f_phone"
        )
        .value
        .trim(),

    school:
      currentSchool,

    active:
      document
        .getElementById(
          "f_active"
        )
        .value === "true"

  };


  try{

    if(editingPlayerId){

      const result =
        await supabaseClient
          .from("players")
          .update(playerData)
          .eq(
            "id",
            editingPlayerId
          );


      if(result.error){

        throw new Error(
          "Guardar jugador: " +
          result.error.message
        );

      }

    }else{

      playerData.id =
        "id_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2,9);


      const result =
        await supabaseClient
          .from("players")
          .insert(
            playerData
          );


      if(result.error){

        throw new Error(
          "Crear jugador: " +
          result.error.message
        );

      }

    }


    closeModal();

    await loadData();


    showMessage(
      "Jugador guardado correctamente.",
      "success"
    );


  }catch(error){

    console.error(error);

    alert(
      "NO SE PUDO GUARDAR EL JUGADOR\n\n" +
      error.message
    );

  }

}

        .substring(2,8),

    player_id:

    method:
      "Efectivo",

    note:
      "",

    date:
      new Date().toISOString()

  };


  try{

    const result =
      await supabaseClient
        .from("pagos")
        .insert(

        );


    if(result.error){

      throw new Error(

    );

      error.message
    );

  }

}

async function saveFee(){

  const input =
    document.getElementById(
      "fee"
    );


  const amount =
    Number(
      input.value
    );


  if(!amount){

    alert(
      "Ingresá una cuota válida."
    );

    return;

  }


  const key =
    monthKey();


  try{

    const existing =
      data.fees.find(
        fee => {

          const school =
            fee.school ??
            fee.escuela ??
            fee.school_name ??
            "";

          const month =
            fee.month_key ??
            fee.monthKey ??
            fee.mes ??
            "";

          return (
            school === currentSchool &&
            month === key
          );

        }
      );


    if(existing){

      const result =
        await supabaseClient
          .from("fees")
          .update({
            amount:amount
          })
          .eq(
            "id",
            existing.id
          );


      if(result.error){

        throw new Error(
          "Actualizar cuota: " +
          result.error.message
        );

      }

    }else{

      const result =
        await supabaseClient
          .from("fees")
          .insert({

            id:
              "fee_" +
              Date.now(),

            school:
              currentSchool,

            month_key:
              key,

            amount:
              amount

          });


      if(result.error){

        throw new Error(
          "Crear cuota: " +
          result.error.message
        );

      }

    }


    await loadData();


    showMessage(
      "Cuota guardada correctamente.",
      "success"
    );


  }catch(error){

    console.error(error);

    alert(
      "NO SE PUDO GUARDAR LA CUOTA\n\n" +
      error.message
    );

  }

}
