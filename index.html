<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>Mis Escuelas ⚽</title>

  <style>

    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --green: #15803d;
      --blue: #2563eb;
      --red: #b91c1c;
      --amber: #b45309;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 90px;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 15px;
    }

    .selector,
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 2px 10px #00000010;
    }

    .selector {
      padding: 12px;
      margin-bottom: 14px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: white;
      font: inherit;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      padding: 15px;
      margin-bottom: 14px;
    }

    .metric {
      font-size: 23px;
      font-weight: 800;
      margin-top: 4px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 14px 0;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px;
      font: inherit;
      font-weight: bold;
      background: #111827;
      color: white;
      cursor: pointer;
      min-height: 44px;
    }

    .btn:active {
      transform: scale(.98);
    }

    .green {
      background: var(--green);
    }

    .blue {
      background: var(--blue);
    }

    .danger {
      background: var(--red);
    }

    .amber {
      background: var(--amber);
    }

    .ghost {
      background: white;
      color: #111827;
      border: 1px solid var(--line);
    }

    .section {
      margin-top: 14px;
    }

    .section h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .info b {
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
    }

    .paid {
      background: #dcfce7;
      color: #166534;
    }

    .pending {
      background: #fee2e2;
      color: #991b1b;
    }

    .warn {
      background: #fef3c7;
      color: #92400e;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 8px;
    }

    .notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
    }

    .error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .success {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      inset: 0;
      background: #0008;
      align-items: flex-end;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      background: white;
      width: 100%;
      max-width: 760px;
      margin: auto;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      max-height: 92vh;
      overflow: auto;
    }

    .sheet h2 {
      margin-top: 0;
    }

    .field {
      margin: 10px 0;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px;
      z-index: 50;
    }

    nav button {
      border: 0;
      background: none;
      color: #6b7280;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
    }

    nav button.active {
      color: #111827;
      font-weight: bold;
    }

    nav span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    @media (min-width: 600px) {

      .modal {
        align-items: center;
        padding: 20px;
      }

      .sheet {
        border-radius: 20px;
      }

      .actions {
        grid-template-columns: 1fr 1fr 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>⚽ Mis Escuelas</h1>

  <p>
    Gestión de jugadores, cuotas y pagos
  </p>

</header>


<main>

  <div id="message"></div>


  <div class="selector">

    <div class="small">
      ESCUELA / SEDE
    </div>

    <select id="school">

      <option>
        Cargando...
      </option>

    </select>

  </div>


  <div id="app">

    <div class="loading">
      ⏳ Cargando aplicación...
    </div>

  </div>

</main>


<!-- MODAL -->

<div
  class="modal"
  id="modal"
>

  <div class="sheet">

    <h2 id="modalTitle">
      Formulario
    </h2>

    <div id="form"></div>

    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="saveForm()"
      >
        Guardar
      </button>

      <button
        type="button"
        class="btn ghost"
        onclick="closeModal()"
      >
        Cancelar
      </button>

    </div>

  </div>

</div>


<!-- NAVEGACIÓN -->

<nav>

  <button
    type="button"
    class="active"
    onclick="setView('home', this)"
  >
    <span>🏠</span>
    Inicio
  </button>


  <button
    type="button"
    onclick="setView('players', this)"
  >
    <span>👥</span>
    Jugadores
  </button>


  <button
    type="button"
    onclick="setView('payments', this)"
  >
    <span>💰</span>
    Pagos
  </button>


  <button
    type="button"
    onclick="setView('settings', this)"
  >
    <span>⚙️</span>
    Opciones
  </button>

</nav>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://inehoqxikbsuhguxxngz.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sy4qDmB2FcYZ6hC_2IWJLA_H9u89I2h";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


console.log(
  "JAVASCRIPT DE MIS ESCUELAS CARGADO"
);


/* =========================================================
   VARIABLES
========================================================= */

let data = {

  schools: [],

  players: [],

  fees: [],

  pagos: []

};


let currentView =
  "home";


let currentSchool =
  "";


let editingPlayerId =
  null;


let reportMonth =
  monthKey();


/* =========================================================
   UTILIDADES
========================================================= */

function money(n) {

  return new Intl.NumberFormat(
    "es-AR",
    {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    }
  ).format(Number(n) || 0);

}


function monthKey(d = new Date()) {

  return (

    d.getFullYear() +

    "-" +

    String(
      d.getMonth() + 1
    ).padStart(2, "0")

  );

}


function monthName(
  key = monthKey()
) {

  const parts =
    key.split("-");


  const y =
    Number(parts[0]);


  const m =
    Number(parts[1]);


  return new Date(
    y,
    m - 1,
    1
  ).toLocaleDateString(
    "es-AR",
    {
      month: "long",
      year: "numeric"
    }
  );

}


function esc(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function showMessage(
  text,
  type = "success"
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML =
    `<div class="${type}">
      ${esc(text)}
    </div>`;


  setTimeout(
    function () {

      box.innerHTML = "";

    },
    4000
  );

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadData() {

  console.log(
    "Cargando datos..."
  );


  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `
    <div class="loading">
      ⏳ Conectando con Supabase...
    </div>
  `;


  try {

    const schoolsResult =
      await supabaseClient
        .from("schools")
        .select("*");


    if (
      schoolsResult.error
    ) {

      throw schoolsResult.error;

    }


    const playersResult =
      await supabaseClient
        .from("players")
        .select("*");


    if (
      playersResult.error
    ) {

      throw playersResult.error;

    }


    const feesResult =
      await supabaseClient
        .from("fees")
        .select("*");


    if (
      feesResult.error
    ) {

      throw feesResult.error;

    }


    const pagosResult =
      await supabaseClient
        .from("pagos")
        .select("*");


    if (
      pagosResult.error
    ) {

      throw pagosResult.error;

    }


    data.schools =
      schoolsResult.data || [];


    data.players =
      playersResult.data || [];


    data.fees =
      feesResult.data || [];


    data.pagos =
      pagosResult.data || [];


    console.log(
      "Escuelas:",
      data.schools
    );


    console.log(
      "Jugadores:",
      data.players
    );


    console.log(
      "Cuotas:",
      data.fees
    );


    console.log(
      "Pagos:",
      data.pagos
    );


    prepareSchools();


    render();


    showMessage(
      "Datos sincronizados correctamente.",
      "success"
    );


  } catch (error) {

    console.error(
      "ERROR SUPABASE:",
      error
    );


    app.innerHTML = `

      <div class="card">

        <h2>
          ⚠️ Error al conectar
        </h2>

        <p>
          La aplicación no pudo
          leer los datos de Supabase.
        </p>

        <div class="error">

          ${esc(
            error.message ||
            error
          )}

        </div>

        <button
          type="button"
          class="btn blue"
          onclick="loadData()"
        >
          🔄 Reintentar
        </button>

      </div>

    `;

  }

}


/* =========================================================
   ESCUELAS
========================================================= */

function prepareSchools() {

  const select =
    document.getElementById(
      "school"
    );


  if (
    !data.schools.length
  ) {

    select.innerHTML =
      `<option value="">
        Sin escuelas
      </option>`;


    currentSchool =
      "";


    return;

  }


  select.innerHTML =
    data.schools
      .map(
        function (s) {

          const name =
            s.name ||
            s.nombre ||
            s.school ||
            "";


          return `

            <option
              value="${esc(name)}"
            >
              ${esc(name)}
            </option>

          `;

        }
      )
      .join("");


  const exists =
    currentSchool &&
    data.schools.some(
      function (s) {

        return (
          (
            s.name ||
            s.nombre ||
            s.school
          ) ===
          currentSchool
        );

      }
    );


  if (exists) {

    select.value =
      currentSchool;

  } else {

    currentSchool =
      data.schools[0].name ||
      data.schools[0].nombre ||
      data.schools[0].school ||
      "";


    select.value =
      currentSchool;

  }


  select.onchange =
    function () {

      currentSchool =
        this.value;


      render();

    };

}


/* =========================================================
   JUGADORES DE LA ESCUELA
========================================================= */

function schoolPlayers() {

  return data.players.filter(
    function (p) {

      const school =
        p.school ||
        p.school_name ||
        p.escuela ||
        "";


      return (
        school ===
        currentSchool
      );

    }
  );

}


function activePlayers() {

  return schoolPlayers()
    .filter(
      function (p) {

        return p.active !== false;

      }
    );

}


/* =========================================================
   PAGOS
========================================================= */

function playerPayment(
  playerId,
  key
) {

  return data.pagos.find(
    function (p) {

      const pid =
        p.player_id ||
        p.playerId;


      const month =
        p.month_key ||
        p.monthKey;


      const school =
        p.school ||
        p.escuela ||
        "";


      return (

        String(pid) ===
        String(playerId)

        &&

        month === key

        &&

        school ===
        currentSchool

      );

    }
  );

}


/* =========================================================
   CUOTA ACTUAL
========================================================= */

function currentFee(
  key = monthKey()
) {

  const found =
    data.fees.find(
      function (f) {

        const school =
          f.school ||
          f.escuela ||
          f.school_name ||
          "";


        const month =
          f.month_key ||
          f.monthKey ||
          f.mes ||
          "";


        return (

          school ===
          currentSchool

          &&

          month === key

        );

      }
    );


  if (found) {

    return Number(

      found.amount ||
      found.monto ||
      found.fee ||
      0

    );

  }


  return 20000;

}


/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render() {

  if (!currentSchool) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <div class="empty">

          No hay ninguna escuela disponible.

        </div>

      </div>

    `;

    return;

  }


  if (
    currentView ===
    "home"
  ) {

    home();

  }


  if (
    currentView ===
    "players"
  ) {

    players();

  }


  if (
    currentView ===
    "payments"
  ) {

    payments();

  }


  if (
    currentView ===
    "settings"
  ) {

    settings();

  }

}


/* =========================================================
   INICIO
========================================================= */

function home() {

  const key =
    monthKey();


  const list =
    activePlayers();


  const paid =
    list.filter(
      function (p) {

        return !!playerPayment(
          p.id,
          key
        );

      }
    ).length;


  const collected =
    data.pagos
      .filter(
        function (p) {

          const school =
            p.school ||
            p.escuela ||
            "";


          const month =
            p.month_key ||
            p.monthKey;


          return (

            school ===
            currentSchool

            &&

            month === key

          );

        }
      )
      .reduce(
        function (
          total,
          p
        ) {

          return (
            total +
            Number(
              p.amount ||
              p.monto ||
              0
            )
          );

        },
        0
      );


  const expected =
    list.length *
    currentFee(key);


  const pending =
    Math.max(
      0,
      expected -
      collected
    );


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="grid">

      <div class="card">

        <div class="label">
          Jugadores activos
        </div>

        <div class="metric">
          ${list.length}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Pagaron este mes
        </div>

        <div class="metric">
          ${paid}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Recaudado
        </div>

        <div class="metric">
          ${money(collected)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Pendiente
        </div>

        <div class="metric">
          ${money(pending)}
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="openPlayer()"
      >
        ＋ Agregar jugador
      </button>


      <button
        type="button"
        class="btn blue"
        onclick="openPayment()"
      >
        ✓ Registrar pago
      </button>

    </div>


    <div class="card section">

      <h2>
        📅 Cuotas de
        ${esc(monthName(key))}
      </h2>

      ${pendingRows(
        list,
        key
      )}

    </div>


    <div class="notice">

      💰 Cuota actual:
      <b>
        ${money(
          currentFee(key)
        )}
      </b>

      <br><br>

      Escuela seleccionada:
      <b>
        ${esc(currentSchool)}
      </b>

    </div>

  `;

}


/* =========================================================
   PENDIENTES
========================================================= */

function pendingRows(
  list,
  key
) {

  const pending =
    list.filter(
      function (p) {

        return !playerPayment(
          p.id,
          key
        );

      }
    );


  if (!pending.length) {

    return `

      <div class="empty">

        🎉 Todos los jugadores
        están al día.

      </div>

    `;

  }


  return pending
    .map(
      function (p) {

        return `

          <div class="row">

            <div class="info">

              <b>
                ${esc(p.name)}
              </b>

              <span class="small">
                ${esc(
                  p.category ||
                  "Sin categoría"
                )}
              </span>

            </div>


            <button
              type="button"
              class="btn green"
              style="padding:8px 10px"
              onclick="quickPay('${esc(p.id)}')"
            >
              Pagó
            </button>

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   JUGADORES
========================================================= */

function players() {

  const list =
    schoolPlayers();


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="actions">

      <button
        type="button"
        class="btn green"
        onclick="openPlayer()"
      >
        ＋ Nuevo jugador
      </button>


      <button
        type="button"
        class="btn ghost"
        onclick="loadData()"
      >
        🔄 Actualizar
      </button>

    </div>


    <input
      id="search"
      placeholder="🔎 Buscar jugador..."
      oninput="filterPlayers()"
    >


    <div
      class="card section"
      id="playerList"
    >

      ${playerRows(list)}

    </div>

  `;

}


/* =========================================================
   FILAS DE JUGADORES
========================================================= */

function playerRows(list) {

  if (!list.length) {

    return `

      <div class="empty">

        No hay jugadores
        en esta escuela.

      </div>

    `;

  }


  return list
    .map(
      function (p) {

        return `

          <div class="row">

            <div class="info">

              <b>

                ${esc(p.name)}

                ${
                  p.active === false
                    ? `
                      <span
                        class="badge warn"
                      >
                        INACTIVO
                      </span>
                    `
                    : ""
                }

              </b>


              <span class="small">

                ${esc(
                  p.category ||
                  "Sin categoría"
                )}

                ·

                ${esc(
                  p.phone ||
                  "Sin teléfono"
                )}

              </span>

            </div>


            <button
              type="button"
              class="btn"
              style="padding:8px 10px"
              onclick="openPlayer('${esc(p.id)}')"
            >
              Editar
            </button>

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   BUSCADOR
========================================================= */

function filterPlayers() {

  const input =
    document.getElementById(
      "search"
    );


  const q =
    (
      input.value ||
      ""
    )
      .toLowerCase();


  const list =
    schoolPlayers()
      .filter(
        function (p) {

          const text =
            [
              p.name,
              p.category,
              p.phone
            ]
              .join(" ")
              .toLowerCase();


          return text.includes(q);

        }
      );


  document.getElementById(
    "playerList"
  ).innerHTML =
    playerRows(list);

}


/* =========================================================
   NUEVO / EDITAR JUGADOR
========================================================= */

function openPlayer(
  id = null
) {

  editingPlayerId =
    id;


  let player = {};


  if (id) {

    player =
      data.players.find(
        function (p) {

          return (
            String(p.id) ===
            String(id)
          );

        }
      ) || {};

  }


  document.getElementById(
    "modalTitle"
  ).textContent =
    id
      ? "Editar jugador"
      : "Nuevo jugador";

/* =========================================================
   GUARDAR JUGADOR
========================================================= */

async function savePlayer() {

  const name =
    document.getElementById(
      "f_name"
    ).value.trim();


  if (!name) {

    alert(
      "Ingresá el nombre del jugador."
    );

    return;

  }


  const playerData = {

    name: name,

    category:
      document.getElementById(
        "f_category"
      ).value.trim(),

    birth:
      document.getElementById(
        "f_birth"
      ).value || null,

    tutor:
      document.getElementById(
        "f_tutor"
      ).value.trim(),

    phone:
      document.getElementById(
        "f_phone"
      ).value.trim(),

    school:
      currentSchool,

    active:
      document.getElementById(
        "f_active"
      ).value === "true"

  };


  try {

    if (
      editingPlayerId
    ) {

      const result =
        await supabaseClient
          .from("players")
          .update(
            playerData
          )
          .eq(
            "id",
            editingPlayerId
          );


      if (
        result.error
      ) {

        throw result.error;

      }

    } else {

      playerData.id =
        "id_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 9);


      const result =
        await supabaseClient
          .from("players")
          .insert(
            playerData
          );


      if (
        result.error
      ) {

        throw result.error;

      }

    }


    closeModal();


    await loadData();


    showMessage(
      "Jugador guardado correctamente.",
      "success"
    );


  } catch (error) {

    console.error(error);


    alert(
      "No se pudo guardar el jugador:\n\n" +
      (
        error.message ||
        error
      )
    );

  }

}


/* =========================================================

========================================================= */

function payments() {

  const key =
    monthKey();


  document.getElementById(
    "app"
  ).innerHTML = `

/* =========================================================
   RENDER PAGOS
========================================================= */

function renderPayments() {

  const input =
    document.getElementById(
      "paymentMonth"
    );


  const key =
    input
      ? (
          input.value ||
          monthKey()
        )
      : monthKey();


  const list =
    activePlayers();


  const rows =
    list
      .map(
        function (p) {

          const payment =
            playerPayment(
              p.id,
              key
            );


          if (payment) {

            return `

              <div class="row">

                <div class="info">

                  <b>
                    ${esc(p.name)}
                  </b>

                  <span class="small">

                    ${money(
                      payment.amount ||
                      payment.monto ||
                      0
                    )}

                    ·

                    ${esc(
                      payment.method ||
                      payment.medio ||
                      "Pago"
                    )}

                  </span>

                </div>


                <span
                  class="badge paid"
                >
                  PAGADO
                </span>

              </div>

            `;

          }


          return `

            <div class="row">

              <div class="info">

                <b>
                  ${esc(p.name)}
                </b>

                <span class="small">
                  Sin pago registrado
                </span>

              </div>


              <button
                type="button"
                class="btn green"
                style="padding:8px 10px"
                onclick="quickPay('${esc(p.id)}','${key}')"
              >
                Pagó
              </button>

            </div>

          `;

        }
      )
      .join("");


  document.getElementById(
    "paymentsBody"
  ).innerHTML = `

    <div class="actions">

      <button
        type="button"
        class="btn blue"
        onclick="openPayment(null,'${key}')"
      >
        ＋ Registrar pago
      </button>


      <button
        type="button"
        class="btn ghost"
        onclick="loadData()"
      >
        🔄 Actualizar
      </button>

    </div>


    <div class="card">

      <h2 style="margin-top:0">

        💰 Pagos ·
        ${esc(monthName(key))}

      </h2>

      ${
        rows ||

        `<div class="empty">
          No hay jugadores.
        </div>`
      }

    </div>

  `;

}


/* =========================================================
   PAGO RÁPIDO
========================================================= */

async function quickPay(
  playerId,
  key = monthKey()
) {

  if (
    playerPayment(
      playerId,
      key
    )
  ) {

    alert(
      "Este jugador ya figura como pagado."
    );

    return;

  }


  const amount =
    currentFee(key);


  const player =
    data.players.find(
      function (p) {

        return (
          String(p.id) ===
          String(playerId)
        );

      }
    );


  if (!player) {

    alert(
      "No se encontró el jugador."
    );

    return;

  }


  const payment = {

    id:
      "pago_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 8),

    player_id:
      playerId,

    school:
      currentSchool,

    month_key:
      key,

    amount:
      amount,

    method:
      "Efectivo",

    note:
      "",

    date:
      new Date().toISOString()

  };


  try {

    const result =
      await supabaseClient
        .from("pagos")
        .insert(
          payment
        );


    if (
      result.error
    ) {

      throw result.error;

    }


    await loadData();


    showMessage(
      "Pago registrado correctamente.",
      "success"
    );


  } catch (error) {

    console.error(error);


    alert(
      "No se pudo registrar el pago:\n\n" +
      (
        error.message ||
        error
      )
    );

  }

}

/* =========================================================
   GUARDAR CUOTA
========================================================= */

async function saveFee() {

  const feeElement =
    document.getElementById(
      "fee"
    );


  if (!feeElement) {

    return;

  }


  const amount =
    Number(
      feeElement.value
    );


  if (!amount) {

    alert(
      "Ingresá una cuota válida."
    );

    return;

  }


  const key =
    monthKey();


  try {

    const existing =
      data.fees.find(
        function (f) {

          const school =
            f.school ||
            f.escuela ||
            f.school_name ||
            "";


          const month =
            f.month_key ||
            f.monthKey ||
            f.mes ||
            "";


          return (

            school ===
            currentSchool

            &&

            month === key

          );

        }
      );


    if (existing) {

      const result =
        await supabaseClient
          .from("fees")
          .update({
            amount:
              amount
          })
          .eq(
            "id",
            existing.id
          );


      if (
        result.error
      ) {

        throw result.error;

      }

    } else {

      const result =
        await supabaseClient
          .from("fees")
          .insert({

            id:
              "fee_" +
              Date.now(),

            school:
              currentSchool,

            month_key:
              key,

            amount:
              amount

          });


      if (
        result.error
      ) {

        throw result.error;

      }

    }


    await loadData();


    showMessage(
      "Cuota guardada correctamente.",
      "success"
    );


  } catch (error) {

    console.error(error);


    alert(
      "No se pudo guardar la cuota:\n\n" +
      (
        error.message ||
        error
      )
    );

  }

}

function setView(
  view,
  button
) {

  console.log(
    "Cambiando vista:",
    view
  );


  currentView =
    view;


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      function (b) {

        b.classList.remove(
          "active"
        );

      }
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  render();

}


/* =========================================================
   MODAL
========================================================= */

function showModal() {

  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "show"
    );

}


function closeModal() {

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );


  editingPlayerId =
    null;

}
