<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mis Escuelas ⚽</title>

<!-- Supabase JS Client desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --green:#15803d;
  --red:#dc2626;
  --blue:#2563eb;
  --line:#e5e7eb;
  --amber:#b45309;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:90px;
}

header{
  background:#111827;
  color:white;
  padding:22px 18px 18px;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:5px 0 0;
  color:#cbd5e1;
  font-size:14px;
}

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:15px;
}

.selector,
.card{
  background:var(--card);
  border-radius:16px;
  box-shadow:0 2px 10px #0000000b;
}

.selector{
  padding:12px;
  margin-bottom:14px;
}

select,
input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  font:inherit;
}

button{
  font-family:inherit;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  padding:15px;
}

.metric{
  font-size:23px;
  font-weight:800;
  margin-top:4px;
}

.label{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:14px 0;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px;
  font:inherit;
  font-weight:750;
  background:#111827;
  color:white;
  cursor:pointer;
  min-height:44px;
}

.btn:active{
  transform:scale(.98);
}

.green{
  background:var(--green);
}

.blue{
  background:var(--blue);
}

.danger{
  background:#b91c1c;
}

.amber{
  background:var(--amber);
}

.ghost{
  background:white;
  color:#111827;
  border:1px solid var(--line);
}

.section{
  margin-top:14px;
}

.section h2{
  font-size:18px;
  margin:0 0 10px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.row .info{
  min-width:0;
  flex:1;
}

.row b{
  display:block;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fee2e2;
  color:#991b1b;
}

.bluebadge{
  background:#dbeafe;
  color:#1e40af;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.search{
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:24px 8px;
}

.notice{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
}

.field{
  margin:10px 0;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:14px 0;
}

.reportbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.mini{
  background:#f9fafb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.mini b{
  display:block;
  font-size:16px;
  margin-top:2px;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.table th,
.table td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.right{
  text-align:right!important;
}

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:#0008;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  background:white;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin-top:0;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:90;
}

nav button{
  border:0;
  background:none;
  color:#6b7280;
  font:inherit;
  font-size:11px;
  cursor:pointer;
  padding:4px 7px;
}

nav button.active{
  color:#111827;
  font-weight:800;
}

nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.status.ok{
  background:#dcfce7;
  color:#166534;
}

.status.error{
  background:#fee2e2;
  color:#991b1b;
}

@media(min-width:600px){
  .modal{
    align-items:center;
    padding:20px;
  }
  .sheet{
    border-radius:20px;
  }
  .actions{
    grid-template-columns:repeat(3,1fr);
  }
  .reportbar{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
  .two{
    grid-template-columns:1fr;
  }
  .actions{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Mis Escuelas</h1>
  <p>Gestión de jugadores, cuotas, historial y comprobantes</p>
</header>

<main>
  <div class="selector">
    <div class="small">ESCUELA / SEDE</div>
    <select id="school"></select>
  </div>

  <div id="app"></div>
</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <div id="form"></div>
    <div class="actions">
      <button
        type="button"
        class="btn green"
        onclick="saveForm()">
        Guardar
      </button>

      <button
        type="button"
        class="btn ghost"
        onclick="closeModal()">
        Cancelar
      </button>
    </div>
  </div>
</div>

<!-- NAVEGACIÓN -->
<nav>
  <button
    type="button"
    data-view="home"
    class="active"
    onclick="navigate('home')">
    <span>🏠</span>
    Inicio
  </button>

  <button
    type="button"
    data-view="players"
    onclick="navigate('players')">
    <span>👥</span>
    Jugadores
  </button>

  <button
    type="button"
    data-view="payments"
    onclick="navigate('payments')">
    <span>💰</span>
    Cuotas
  </button>

  <button
    type="button"
    data-view="reports"
    onclick="navigate('reports')">
    <span>📊</span>
    Reportes
  </button>

  <button
    type="button"
    data-view="settings"
    onclick="navigate('settings')">
    <span>⚙️</span>
    Opciones
  </button>
</nav>

<script>

/* =========================================================
   CONFIGURACIÓN Y SUPABASE (OPCIONAL)
   ========================================================= */

const STORAGE_KEY = "misEscuelas_v4";

// Reemplaza con las credenciales de tu proyecto Supabase si deseas sincronizar
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e) {
    console.error("Error al inicializar Supabase:", e);
  }
}

const DEFAULT_SCHOOLS = [
  "Semillitas",
  "La Cantera",
  "Nueva Escuela"
];


/* =========================================================
   ESTADO DE LA APLICACIÓN
   ========================================================= */

let data = null;
let currentView = "home";
let editId = null;
let formType = null;
let reportMonth = monthKey();
let showInactive = false;


/* =========================================================
   ELEMENTOS
   ========================================================= */

const app = document.getElementById("app");
const schoolSelect = document.getElementById("school");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const form = document.getElementById("form");


/* =========================================================
   FUNCIONES GENERALES Y LIMPIEZA DE DATOS
   ========================================================= */

// Convierte cadenas vacías ("") a NULL para evitar errores de tipo Date en BD/Supabase
function cleanValue(val) {
  if (val === null || val === undefined) return null;
  if (typeof val === 'string' && val.trim() === '') return null;
  return val;
}

function money(value){
  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:0
    }
  ).format(Number(value) || 0);
}

function esc(value){
  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){
      const map = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      };
      return map[char];
    });
}

function attr(value){
  return esc(value);
}

function makeId(){
  return (
    "id_" +
    Date.now() +
    "_" +
    Math.random().toString(36).substring(2,10)
  );
}

function monthKey(date = new Date()){
  return (
    date.getFullYear() +
    "-" +
    String(date.getMonth()+1).padStart(2,"0")
  );
}

function monthName(key = monthKey()){
  const parts = String(key).split("-").map(Number);
  if(parts.length !== 2 || !parts[0] || !parts[1]){
    return key;
  }
  return new Date(parts[0], parts[1]-1, 1).toLocaleDateString(
    "es-AR",
    { month:"long", year:"numeric" }
  );
}

function formatDate(value){
  if(!value) return "";
  const date = new Date(value);
  if(isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString("es-AR");
}


/* =========================================================
   CARGAR DATOS
   ========================================================= */

function createEmptyData(){
  return {
    schools:[...DEFAULT_SCHOOLS],
    players:[],
    payments:[],
    expenses:[],
    fees:{},
    feeHistory:{}
  };
}

function loadData(){
  let saved = null;
  try{
    saved = localStorage.getItem(STORAGE_KEY);
  }catch(error){
    console.error("No se pudo acceder a localStorage.", error);
  }

  if(saved){
    try{
      data = JSON.parse(saved);
    }catch(error){
      console.error("Los datos guardados están dañados.", error);
      data = createEmptyData();
    }
  }else{
    data = createEmptyData();
  }

  normalizeData();
}

function normalizeData(){
  if(!data || typeof data !== "object") data = createEmptyData();
  if(!Array.isArray(data.schools)) data.schools = [];
  if(!Array.isArray(data.players)) data.players = [];
  if(!Array.isArray(data.payments)) data.payments = [];
  if(!Array.isArray(data.expenses)) data.expenses = [];
  if(!data.fees || typeof data.fees !== "object") data.fees = {};
  if(!data.feeHistory || typeof data.feeHistory !== "object") data.feeHistory = {};

  if(data.schools.length === 0){
    data.schools = [...DEFAULT_SCHOOLS];
  }

  data.schools = [...new Set(
    data.schools.map(String).map(x => x.trim()).filter(Boolean)
  )];
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(error){
    console.error("No se pudieron guardar los datos.", error);
    alert("No se pudieron guardar los datos en este dispositivo.");
    return false;
  }
}


/* =========================================================
   ESCUELA ACTUAL
   ========================================================= */

function currentSchool(){
  if(!data.schools.length) return "";
  const index = Number(schoolSelect.value);
  if(Number.isInteger(index) && index >= 0 && index < data.schools.length){
    return data.schools[index];
  }
  return data.schools[0];
}

function populateSchools(){
  const previous = schoolSelect.value;
  schoolSelect.innerHTML = data.schools
    .map((name, index) => `<option value="${index}">${esc(name)}</option>`)
    .join("");

  if(previous !== "" && Number(previous) < data.schools.length){
    schoolSelect.value = previous;
  }
}


/* =========================================================
   JUGADORES
   ========================================================= */

function activePlayers(){
  return data.players.filter(player => player.school === currentSchool() && player.active !== false);
}

function allSchoolPlayers(){
  return data.players.filter(player => player.school === currentSchool());
}


/* =========================================================
   CUOTAS
   ========================================================= */

function getFee(schoolName = currentSchool(), key = monthKey()){
  const history = data.feeHistory[schoolName];
  if(history && history[key] !== undefined){
    return Number(history[key]) || 0;
  }
  if(data.fees[schoolName] !== undefined){
    return Number(data.fees[schoolName]) || 0;
  }
  return 20000;
}

function setFeeForMonth(schoolName, key, value){
  if(!data.feeHistory[schoolName]){
    data.feeHistory[schoolName] = {};
  }
  data.feeHistory[schoolName][key] = Number(value);
  data.fees[schoolName] = Number(value);
}

function findPayment(playerId, key = monthKey()){
  return data.payments.find(payment => 
    payment.playerId === playerId &&
    payment.school === currentSchool() &&
    payment.monthKey === key
  );
}

function paymentsForMonth(key = monthKey()){
  return data.payments.filter(payment =>
    payment.school === currentSchool() &&
    payment.monthKey === key
  );
}


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

function navigate(view){
  const validViews = ["home", "players", "payments", "reports", "settings"];
  if(!validViews.includes(view)) view = "home";

  currentView = view;
  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.view === view);
  });

  render();
}

function setView(view){ navigate(view); }
function setViewByName(view){ navigate(view); }


/* =========================================================
   RENDER
   ========================================================= */

function render(){
  try{
    if(currentView === "home") return renderHome();
    if(currentView === "players") return renderPlayers();
    if(currentView === "payments") return renderPayments();
    if(currentView === "reports") return renderReports();
    if(currentView === "settings") return renderSettings();
    navigate("home");
  }catch(error){
    console.error("Error al mostrar la pantalla:", error);
    app.innerHTML = `
      <div class="card">
        <h2>⚠️ Ocurrió un error</h2>
        <p class="small">La aplicación encontró un problema al mostrar esta pantalla.</p>
        <button class="btn" onclick="navigate('home')">Volver al inicio</button>
      </div>
    `;
  }
}


/* =========================================================
   INICIO
   ========================================================= */

function renderHome(){
  const list = activePlayers();
  const key = monthKey();
  const paidCount = list.filter(player => Boolean(findPayment(player.id, key))).length;
  const payments = paymentsForMonth(key);
  const collected = payments.reduce((total, p) => total + Number(p.amount || 0), 0);
  const expected = list.length * getFee(currentSchool(), key);
  const pending = Math.max(0, expected - collected);

  app.innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="label">Jugadores activos</div>
        <div class="metric">${list.length}</div>
      </div>
      <div class="card">
        <div class="label">Pagaron este mes</div>
        <div class="metric">${paidCount}</div>
      </div>
      <div class="card">
        <div class="label">Recaudado</div>
        <div class="metric">${money(collected)}</div>
      </div>
      <div class="card">
        <div class="label">Pendiente estimado</div>
        <div class="metric">${money(pending)}</div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn green" onclick="openPlayer()">＋ Agregar jugador</button>
      <button type="button" class="btn blue" onclick="openPayment()">✓ Registrar pago</button>
      <button type="button" class="btn amber" onclick="navigate('reports')">📊 Ver reporte</button>
    </div>

    <div class="card section">
      <h2>📅 Cuota de ${esc(monthName(key))}</h2>
      ${renderPendingRows(list, key)}
    </div>

    <div class="notice">
      💡 Cuota actual: <b>${money(getFee(currentSchool(), key))}</b>.
      Podés modificarla desde ⚙️ Opciones.
    </div>
  `;
}

function renderPendingRows(list, key){
  const pending = list.filter(player => !findPayment(player.id, key));
  if(!pending.length){
    return `<div class="empty">🎉 Todos los jugadores están al día.</div>`;
  }

  return pending.map(player => `
    <div class="row">
      <div class="info">
        <b>${esc(player.name)}</b>
        <span class="small">${esc(player.category || "Sin categoría")}</span>
      </div>
      <button type="button" class="btn green" style="padding:8px 10px" onclick="quickPay('${attr(player.id)}','${attr(key)}')">
        Pagó
      </button>
    </div>
  `).join("");
}


/* =========================================================
   JUGADORES
   ========================================================= */

function renderPlayers(){
  const list = allSchoolPlayers();
  app.innerHTML = `
    <div class="actions">
      <button type="button" class="btn green" onclick="openPlayer()">＋ Nuevo jugador</button>
      <button type="button" class="btn ghost" onclick="toggleInactive()">
        👤 ${showInactive ? "Ocultar inactivos" : "Ver activos/inactivos"}
      </button>
    </div>

    <input class="search" id="playerSearch" placeholder="🔎 Buscar jugador..." oninput="filterPlayers()">

    <div class="card" id="playerList">
      ${playerRows(list)}
    </div>
  `;
}

function toggleInactive(){
  showInactive = !showInactive;
  render();
}

function playerRows(list){
  let view = showInactive ? list : list.filter(player => player.active !== false);
  if(!view.length){
    return `<div class="empty">No hay jugadores para mostrar.</div>`;
  }

  return view.map(player => `
    <div class="row">
      <div class="info">
        <b>
          ${esc(player.name)}
          ${player.active === false ? '<span class="badge warn">INACTIVO</span>' : ''}
        </b>
        <span class="small">
          ${esc(player.category || "Sin categoría")} · ${esc(player.phone || "Sin teléfono")}
        </span>
      </div>
      <button type="button" class="btn" style="padding:8px 10px" onclick="openPlayer('${attr(player.id)}')">
        Editar
      </button>
    </div>
  `).join("");
}

function filterPlayers(){
  const input = document.getElementById("playerSearch");
  const container = document.getElementById("playerList");
  if(!input || !container) return;

  const query = input.value.trim().toLowerCase();
  const filtered = allSchoolPlayers().filter(player => {
    const text = [player.name, player.category, player.phone, player.tutor].join(" ").toLowerCase();
    return text.includes(query);
  });

  container.innerHTML = playerRows(filtered);
}


/* =========================================================
   PAGOS
   ========================================================= */

function renderPayments(){
  const key = monthKey();
  app.innerHTML = `
    <div class="card">
      <div class="two">
        <div class="field">
          <label>Mes a consultar</label>
          <input type="month" id="payMonth" value="${key}" onchange="renderPaymentsMonth()">
        </div>
        <div class="field">
          <label>Cuota aplicada</label>
          <input id="payFee" value="${money(getFee(currentSchool(), key))}" disabled>
        </div>
      </div>
    </div>
    <div id="paymentsBody"></div>
  `;
  renderPaymentsMonth();
}

function renderPaymentsMonth(){
  const monthInput = document.getElementById("payMonth");
  if(!monthInput) return;

  const key = monthInput.value || monthKey();
  const list = activePlayers();

  const rows = list.map(player => {
    const payment = findPayment(player.id, key);
    if(payment){
      return `
        <div class="row">
          <div class="info">
            <b>${esc(player.name)}</b>
            <span class="small">
              ${money(payment.amount)} · ${esc(payment.method || "Sin especificar")} · ${formatDate(payment.date)}
            </span>
          </div>
          <div>
            <span class="badge paid">PAGADA</span>
            <button type="button" class="btn ghost" style="padding:7px 9px;margin-left:5px" onclick="receipt('${attr(payment.id)}')">🧾</button>
          </div>
        </div>
      `;
    }

    return `
      <div class="row">
        <div class="info">
          <b>${esc(player.name)}</b>
          <span class="small">Sin pago registrado</span>
        </div>
        <button type="button" class="btn green" style="padding:8px 10px" onclick="quickPay('${attr(player.id)}','${attr(key)}')">
          Pagó
        </button>
      </div>
    `;
  }).join("");

  const body = document.getElementById("paymentsBody");
  if(!body) return;

  body.innerHTML = `
    <div class="actions">
      <button type="button" class="btn blue" onclick="openPayment(null,'${attr(key)}')">＋ Registrar pago</button>
      <button type="button" class="btn ghost" onclick="exportCSV('${attr(key)}')">📥 Exportar mes</button>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Cuotas · ${esc(monthName(key))}</h2>
      ${rows || '<div class="empty">No hay jugadores activos.</div>'}
    </div>

/* =========================================================

function renderReports(){
  const key = reportMonth || monthKey();
  const list = activePlayers();
  const payments = paymentsForMonth(key);
  const paidIds = new Set(payments.map(p => p.playerId));
  const collected = payments.reduce((t, p) => t + Number(p.amount || 0), 0);
  const expected = list.length * getFee(currentSchool(), key);
  const pending = Math.max(0, expected - collected);
  const rate = list.length ? Math.round(paidIds.size / list.length * 100) : 0;

  const methods = {};
  payments.forEach(p => {
    const m = p.method || "Sin especificar";

  app.innerHTML = `
    <div class="card">

      <table class="table">
        <thead>

            <th>Medio de pago</th>
            <th class="right">Importe</th>
          </tr>
        </thead>
        <tbody>
          ${Object.keys(methods).length ? Object.entries(methods).map(([method, value]) => `
            <tr>
              <td>${esc(method)}</td>

    </div>

    <div class="card section">
      <h2 style="margin-top:0">Detalle de pagos</h2>
      ${payments.length ? payments.map(p => {

/* =========================================================
   GUARDAR JUGADOR (CON SANITIZACIÓN PARA EVITAR ERRORES FECHA)
   ========================================================= */

async function savePlayer(){
  const nameInput = document.getElementById("f_name");
  const name = nameInput ? nameInput.value.trim() : "";

  if(!name){
    alert("Ingresá el nombre del jugador.");
    return;
  }

  // Sanitizado de valores: Si fecha o cadenas están vacías, se pasa null
  const rawBirth = document.getElementById("f_birth").value;
  const cleanBirth = cleanValue(rawBirth);

  const player = {
    id: editId || makeId(),
    name: name,
    category: cleanValue(document.getElementById("f_cat").value.trim()),
    birth: cleanBirth, // Evita enviar "" a columnas DATE
    tutor: cleanValue(document.getElementById("f_tutor").value.trim()),
    phone: cleanValue(document.getElementById("f_phone").value.trim()),
    school: currentSchool(),
    active: document.getElementById("f_active").value === "true"
  };

  // 1. Guardar en Supabase si el cliente está activo
  if (supabaseClient) {
    try {
      const payload = {
        nombre: player.name,
        categoria: player.category,
        fecha_nacimiento: player.birth, // NULL si está vacío
        tutor: player.tutor,
        telefono: player.phone,
        escuela: player.school,
        activo: player.active
      };

      const { error } = await supabaseClient
        .from('jugadores')
        .upsert([payload]);

      if (error) {
        console.error("Error al guardar en Supabase:", error.message);
      }
    } catch(err) {
      console.error("Error al sincronizar con Supabase:", err);
    }
  }

  // 2. Guardado Local
  if(editId){
    const index = data.players.findIndex(item => item.id === editId);
    if(index >= 0){
      data.players[index] = player;
    }
  }else{
    data.players.push(player);
  }

  persist();
  closeModal();
  render();
}


/* =========================================================
   GUARDAR PAGO
   ========================================================= */

function savePayment(){
  const playerId = document.getElementById("f_player").value;
  const key = document.getElementById("f_month").value;
  const amount = Number(document.getElementById("f_amount").value);
  const method = document.getElementById("f_method").value;
  const note = cleanValue(document.getElementById("f_note").value.trim());

  if(!playerId || !key || !amount || amount <= 0){
    alert("Completá jugador, mes e importe.");
    return;
  }

  if(findPayment(playerId, key)){
    alert("Ese jugador ya tiene un pago registrado para ese mes.");
    return;
  }

  data.payments.push({
    id: makeId(),
    playerId: playerId,
    school: currentSchool(),
    month: monthName(key),
    monthKey: key,
    amount: amount,
    method: method,
    note: note,
    date: new Date().toISOString()
  });

  persist();
  closeModal();
  render();
}

   ========================================================= */

function saveFee(){
  const input = document.getElementById("fee");
  if(!input) return;

  const value = Number(input.value);
  if(!Number.isFinite(value) || value <= 0){
    alert("Ingresá una cuota válida.");
    return;
  }

  const key = monthKey();
  setFeeForMonth(currentSchool(), key, value);
  persist();
  render();
}


/* =========================================================
   ESCUELAS
   ========================================================= */

function addSchool(){
  const value = prompt("Nombre de la nueva escuela / sede:");
  if(!value || !value.trim()) return;

  const name = value.trim();
  if(data.schools.includes(name)){
    alert("Esa escuela ya existe.");
    return;
  }

  data.schools.push(name);
  persist();
  populateSchools();
  schoolSelect.value = String(data.schools.length - 1);
  render();
}

function renameSchool(index){
  if(index < 0 || index >= data.schools.length) return;

  const oldName = data.schools[index];
  const value = prompt("Nuevo nombre:", oldName);
  if(!value || !value.trim()) return;

  const newName = value.trim();
  if(newName === oldName) return;

  if(data.schools.includes(newName)){
    alert("Ya existe una escuela con ese nombre.");
    return;
  }

  data.schools[index] = newName;

  data.players.forEach(p => {
    if(p.school === oldName) p.school = newName;
  });

  data.payments.forEach(p => {
    if(p.school === oldName) p.school = newName;
  });

  if(data.fees[oldName] !== undefined){
    data.fees[newName] = data.fees[oldName];
    delete data.fees[oldName];
  }

  if(data.feeHistory[oldName]){
    data.feeHistory[newName] = data.feeHistory[oldName];
    delete data.feeHistory[oldName];
  }

  persist();
  populateSchools();
  render();
}

/* =========================================================
   BACKUP
   ========================================================= */

function backup(){
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "mis-escuelas-backup.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


/* =========================================================
   EXPORTAR CSV
   ========================================================= */

function exportCSV(key = null){
  const rows = data.payments.filter(payment =>
    payment.school === currentSchool() && (!key || payment.monthKey === key)
  );

  const header = ["Fecha", "Mes", "Escuela", "Jugador", "Categoría", "Importe", "Medio de pago", "Observación"];
  const output = [header];

  rows.forEach(payment => {
    const player = data.players.find(item => item.id === payment.playerId) || {};
    output.push([
      formatDate(payment.date),
      payment.month,
      payment.school,
      player.name || "",
      player.category || "",
      payment.amount,
      payment.method || "",
      payment.note || ""
    ]);
  });

  const csv = "\ufeff" + output.map(row =>
    row.map(value => '"' + String(value ?? "").replace(/"/g, '""') + '"').join(";")
  ).join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = key ? `mis-escuelas-pagos-${key}.csv` : "mis-escuelas-todos-los-pagos.csv";

  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
