<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardar Jugador - Supabase</title>
  <!-- Carga del SDK oficial de Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:disabled {
      background-color: #94d3a2;
    }
    #mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .exito { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>Registro de Jugador</h2>

  <form id="jugadorForm">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido">
    </div>

    <div class="form-group">
      <label for="fecha_nacimiento">Fecha de Nacimiento (Opcional):</label>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
    </div>

    <button type="submit" id="btnGuardar">Guardar Jugador</button>
  </form>

  <div id="mensaje"></div>

  <script>
    // 1. Configuración de Supabase (Reemplaza con tus credenciales)
    const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
    const SUPABASE_ANON_KEY = 'tu-anon-key-aqui';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Función para sanitizar campos: convierte cadenas vacías ("") a null
    function sanitizarDatos(datos) {
      const datosLimpios = {};
      for (const key in datos) {
        if (typeof datos[key] === 'string' && datos[key].trim() === '') {
          datosLimpios[key] = null;
        } else {
          datosLimpios[key] = datos[key];
        }
      }
      return datosLimpios;
    }

    // 3. Capturar el envío del formulario
    const form = document.getElementById('jugadorForm');
    const mensajeDiv = document.getElementById('mensaje');
    const btnGuardar = document.getElementById('btnGuardar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando...';
      mensajeDiv.style.display = 'none';

      // Extraer datos del formulario
      const formData = new FormData(form);
      const rawData = Object.fromEntries(formData.entries());

      // Sanitizar datos ("" -> null)
      const datosParaEnviar = sanitizarDatos(rawData);

      try {
        // Guardar en la tabla 'jugadores'
        const { data, error } = await supabase
          .from('jugadores')
          .insert([datosParaEnviar])
          .select();

        if (error) throw error;

        // Mostrar mensaje de éxito
        mensajeDiv.className = 'exito';
        mensajeDiv.textContent = '¡Jugador guardado con éxito!';
        mensajeDiv.style.display = 'block';
        form.reset();

      } catch (err) {
        // Mostrar mensaje de error
        mensajeDiv.className = 'error';
        mensajeDiv.textContent = 'Error al guardar: ' + err.message;
        mensajeDiv.style.display = 'block';
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = 'Guardar Jugador';
      }
    });
  </script>
</body>
</html>
