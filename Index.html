<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Escuelas ⚽ v2</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--green:#15803d;--red:#dc2626;--blue:#2563eb;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{background:#111827;color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#cbd5e1;font-size:14px}
main{max-width:720px;margin:auto;padding:15px}.selector,.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #0000000b}.selector{padding:12px;margin-bottom:14px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric{font-size:23px;font-weight:800;margin-top:4px}.label{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{border:0;border-radius:11px;padding:12px;font:inherit;font-weight:750;background:#111827;color:#fff}.green{background:var(--green)}.blue{background:var(--blue)}.danger{background:#b91c1c}
.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .info{min-width:0}.row b{display:block}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.paid{background:#dcfce7;color:#166534}.pending{background:#fee2e2;color:#991b1b}.bluebadge{background:#dbeafe;color:#1e40af}
.search{margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:14px;padding:12px;font-size:13px;margin-top:12px}
.modal{display:none;position:fixed;z-index:20;inset:0;background:#0008;align-items:flex-end;padding:0}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#6b7280;font:inherit;font-size:11px}nav button.active{color:#111827;font-weight:800}nav span{display:block;font-size:20px;margin-bottom:2px}
@media(min-width:600px){.modal{align-items:center;padding:20px}.sheet{border-radius:20px}}
</style>
</head>
<body>
<header><h1>⚽ Mis Escuelas</h1><p>Gestión de jugadores, cuotas y pagos</p></header>
<main>
  <div class="selector">
    <div class="small">ESCUELA / SEDE</div>
    <select id="school"></select>
  </div>
  <div id="app"></div>
</main>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="modalTitle"></h2><div id="form"></div>
  <div class="actions"><button class="btn green" onclick="saveForm()">Guardar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>
</div></div>

<nav>
<button type="button" class="active" onclick="setView('home',this)"><span>🏠</span>Inicio</button>
<button type="button" onclick="setView('players',this)"><span>👥</span>Jugadores</button>
<button type="button" onclick="setView('payments',this)"><span>💰</span>Cuotas</button>
<button type="button" onclick="setView('settings',this)"><span>⚙️</span>Opciones</button>
</nav>

<script>
const KEY='misEscuelas_v2';
const DEFAULT_SCHOOLS=['Semillitas','La Cantera','Nueva Escuela'];
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!data)data={schools:DEFAULT_SCHOOLS,players:[],payments:[],expenses:[],fees:{}};
else{
 data.schools=[...new Set([...DEFAULT_SCHOOLS,...(data.schools||[])])];
 data.players=data.players||[];data.payments=data.payments||[];data.expenses=data.expenses||[];data.fees=data.fees||{};
}
let currentView='home',editId=null,formType=null;
const school=document.getElementById('school');
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const attr=s=>esc(s);
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function init(){
 school.innerHTML=data.schools.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('');
 school.onchange=render;render();
}
function currentSchool(){return data.schools[Number(school.value)||0]}
function ps(){return data.players.filter(p=>p.school===currentSchool())}
function monthName(){return new Date().toLocaleDateString('es-AR',{month:'long',year:'numeric'})}
function monthKey(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fee(s=currentSchool()){return Number(data.fees[s]||20000)}
function paymentFor(id,key=monthKey()){return data.payments.find(p=>p.playerId===id&&p.school===currentSchool()&&p.monthKey===key)}
function render(){if(currentView==='home')home();if(currentView==='players')players();if(currentView==='payments')payments();if(currentView==='settings')settings()}
function home(){
 const list=ps(), paid=list.filter(p=>paymentFor(p.id)).length;
 const collected=data.payments.filter(p=>p.school===currentSchool()&&p.monthKey===monthKey()).reduce((a,p)=>a+p.amount,0);
 const expected=list.length*fee(), pending=Math.max(0,expected-collected);
 document.getElementById('app').innerHTML=`
 <div class="grid">
  <div class="card"><div class="label">Jugadores activos</div><div class="metric">${list.length}</div></div>
  <div class="card"><div class="label">Pagaron ${esc(monthName())}</div><div class="metric">${paid}</div></div>
  <div class="card"><div class="label">Recaudado</div><div class="metric">${money(collected)}</div></div>
  <div class="card"><div class="label">Pendiente estimado</div><div class="metric">${money(pending)}</div></div>
 </div>
 <div class="actions"><button class="btn green" onclick="openPlayer()">＋ Agregar jugador</button><button class="btn blue" onclick="openPayment()">✓ Marcar pago</button></div>
 <div class="card section"><h2>📅 Cuota de ${esc(monthName())}</h2>
 ${pendingRows(list)}</div>
 <div class="notice">💡 Cuota configurada: <b>${money(fee())}</b>. Podés cambiarla desde ⚙️ Opciones. Los datos se guardan en este teléfono.</div>`;
}
function pendingRows(list){
 const pend=list.filter(p=>!paymentFor(p.id));
 if(!pend.length)return '<div class="empty">🎉 Todos los jugadores están al día.</div>';
 return pend.map(p=>`<div class="row"><div class="info"><b>${esc(p.name)}</b><span class="small">${esc(p.category||'Sin categoría')}</span></div><button class="btn green" style="padding:8px 10px" onclick="quickPay('${p.id}')">Pagó</button></div>`).join('');
}
function players(){
 const list=ps();
 document.getElementById('app').innerHTML=`<div class="actions"><button class="btn green" onclick="openPlayer()">＋ Nuevo jugador</button></div>
 <input class="search" id="search" placeholder="🔎 Buscar jugador..." oninput="filterPlayers()">
 <div class="card" id="playerList">${playerRows(list)}</div>`;
}
function playerRows(list){
 if(!list.length)return '<div class="empty">No hay jugadores en esta escuela.</div>';
 return list.map(p=>`<div class="row"><div class="info"><b>${esc(p.name)}</b><span class="small">${esc(p.category||'Sin categoría')} · ${esc(p.phone||'Sin teléfono')}</span></div><button class="btn" style="padding:8px 10px" onclick="openPlayer('${p.id}')">Editar</button></div>`).join('');
}
function filterPlayers(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('playerList').innerHTML=playerRows(ps().filter(p=>(p.name+' '+p.category+' '+p.phone).toLowerCase().includes(q)))}
function payments(){
 const list=ps(), paid=list.filter(p=>paymentFor(p.id)).length;
 document.getElementById('app').innerHTML=`<div class="actions"><button class="btn blue" onclick="openPayment()">＋ Registrar pago</button></div>
 <div class="card"><h2 style="margin-top:0">Cuotas · ${esc(monthName())}</h2>
 ${list.length?list.map(p=>{let x=paymentFor(p.id);return `<div class="row"><div class="info"><b>${esc(p.name)}</b><span class="small">${x?money(x.amount)+' · '+esc(x.method):'Sin pago registrado'}</span></div>${x?'<span class="badge paid">PAGADA</span>':`<button class="btn green" style="padding:8px 10px" onclick="quickPay('${p.id}')">Pagó</button>`}</div>`}).join(''):'<div class="empty">No hay jugadores.</div>'}
 </div><div class="card section"><div class="label">Pagos registrados este mes</div><div class="metric">${paid} / ${list.length}</div></div>`;
}
function settings(){
 document.getElementById('app').innerHTML=`<div class="card">
 <h2 style="margin-top:0">⚙️ Configuración</h2>
 <div class="field"><label>Cuota mensual de ${esc(currentSchool())}</label><input id="fee" type="number" inputmode="decimal" value="${fee()}"></div>
 <button class="btn green" style="width:100%" onclick="saveFee()">Guardar cuota</button>
 </div>
 <div class="card section"><h2 style="margin-top:0">Escuelas / sedes</h2>
 ${data.schools.map((s,i)=>`<div class="row"><div class="info"><b>${esc(s)}</b></div><button class="btn" style="padding:8px 10px" onclick="renameSchool(${i})">Renombrar</button></div>`).join('')}
 <div class="actions"><button class="btn green" onclick="addSchool()">＋ Agregar escuela</button><button class="btn" onclick="backup()">💾 Copia</button></div>
 </div>
 <div class="card section">
 <h2 style="margin-top:0">📱 Usarla como app</h2>
 <p class="small">Si al tocar las pestañas no pasa nada, no es un problema de la app: algunos visores de archivos del iPhone bloquean JavaScript. Abrí este archivo en <b>Safari</b>, no en la vista previa de Archivos.</p>
</div>
 <div class="card section"><h2 style="margin-top:0">Datos</h2><p class="small">La copia guarda jugadores, pagos, cuotas y escuelas.</p><button class="btn danger" style="width:100%" onclick="resetAll()">Borrar datos</button></div>`;
}
function openPlayer(id){
 editId=id||null;formType='player';let p=id?data.players.find(x=>x.id===id):{};
 document.getElementById('modalTitle').textContent=id?'Editar jugador':'Nuevo jugador';
 document.getElementById('form').innerHTML=`
 <div class="field"><label>Nombre y apellido *</label><input id="f_name" value="${attr(p.name||'')}"></div>
 <div class="field"><label>Categoría</label><input id="f_cat" placeholder="Ej. Sub 8" value="${attr(p.category||'')}"></div>
 <div class="field"><label>Fecha de nacimiento</label><input id="f_birth" type="date" value="${attr(p.birth||'')}"></div>
 <div class="field"><label>Padre / madre / tutor</label><input id="f_tutor" value="${attr(p.tutor||'')}"></div>
 <div class="field"><label>Teléfono</label><input id="f_phone" inputmode="tel" value="${attr(p.phone||'')}"></div>`;
 showModal();
}
function openPayment(playerId){
 formType='payment';editId=null;let list=ps();
 document.getElementById('modalTitle').textContent='Registrar cuota';
 document.getElementById('form').innerHTML=`
 <div class="field"><label>Jugador *</label><select id="f_player">${list.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Mes</label><input id="f_month" value="${monthName()}"></div>
 <div class="field"><label>Importe</label><input id="f_amount" type="number" inputmode="decimal" value="${fee()}"></div>
 <div class="field"><label>Medio de pago</label><select id="f_method"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Otro</option></select></div>`;
 showModal();
}
function quickPay(id){
 if(paymentFor(id)){alert('Este jugador ya figura como pagado este mes.');return}
 formType='payment';editId=null;let p=ps().find(x=>x.id===id);
 data.payments.push({id:('id_'+Date.now()+'_'+Math.random().toString(36).slice(2)),playerId:id,school:currentSchool(),month:monthName(),monthKey:monthKey(),amount:fee(),method:'No especificado',date:new Date().toISOString()});
 persist();render();
}
function saveForm(){
 if(formType==='player'){
  let name=document.getElementById('f_name').value.trim();if(!name)return alert('Ingresá el nombre.');
  let obj={id:editId||('id_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name,category:document.getElementById('f_cat').value.trim(),birth:document.getElementById('f_birth').value,tutor:document.getElementById('f_tutor').value.trim(),phone:document.getElementById('f_phone').value.trim(),school:currentSchool(),active:true};
  if(editId){let i=data.players.findIndex(x=>x.id===editId);data.players[i]=obj}else data.players.push(obj);
 }else{
  let id=document.getElementById('f_player').value, amount=Number(document.getElementById('f_amount').value)||0;if(!id||!amount)return alert('Elegí jugador e importe.');
  data.payments.push({id:('id_'+Date.now()+'_'+Math.random().toString(36).slice(2)),playerId:id,school:currentSchool(),month:document.getElementById('f_month').value.trim(),monthKey:monthKey(),amount,method:document.getElementById('f_method').value,date:new Date().toISOString()});
 }
 persist();closeModal();render();
}
function saveFee(){let v=Number(document.getElementById('fee').value);if(!v)return alert('Ingresá una cuota válida.');data.fees[currentSchool()]=v;persist();render()}
function addSchool(){let n=prompt('Nombre de la nueva escuela / sede:');if(n&&n.trim()){data.schools.push(n.trim());persist();init();school.value=data.schools.length-1;render()}}
function renameSchool(i){let old=data.schools[i],n=prompt('Nuevo nombre:',old);if(n&&n.trim()){data.schools[i]=n.trim();data.players.forEach(p=>{if(p.school===old)p.school=n.trim()});data.payments.forEach(p=>{if(p.school===old)p.school=n.trim()});if(data.fees[old]){data.fees[n.trim()]=data.fees[old];delete data.fees[old]}persist();init()}}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mis-escuelas-backup.json';a.click()}
function resetAll(){if(confirm('¿Seguro? Se borrarán todos los jugadores, pagos y configuraciones de este dispositivo.')){localStorage.removeItem(KEY);location.reload()}}
function setView(v,btn){currentView=v;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
init();
</script>
</body>
</html>
